const clone=o=>JSON.parse(JSON.stringify(o));let db;try{db=JSON.parse(localStorage.getItem(key))||clone(sample)}catch(e){db=clone(sample)};if(!Array.isArray(db.trash))db.trash=[];let page='home',selectedProjectId='',modal='',docType='offers',docItems=[];const fmt=n=>new Intl.NumberFormat('sl-SI',{style:'currency',currency:'EUR'}).format(Number(n)||0),dateFmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('sl-SI'):'—';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const findClient=id=>db.clients.find(x=>x.id===id)?.name||'Neznana stranka';const save=()=>{try{localStorage.setItem(key,JSON.stringify(db))}catch(e){toast('Shranjevanje ni uspelo – izvozi varnostno kopijo.')}};const id=()=>Math.random().toString(36).slice(2,10);const today=()=>new Date().toISOString().slice(0,10);const totalDoc=o=>o.amount*(1+(Number(o.vat)||0)/100);const sum=(arr,fn)=>arr.reduce((a,x)=>a+(Number(fn(x))||0),0);function toast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display='none',3000)}

function status(x){let c=x==='Plačano'||x==='Potrjeno'||x==='Zaključeno'?'green':x==='Zamuda'?'red':'amber';return `<span class="pill ${c}">${esc(x||'Osnutek')}</span>`}
function sortedProjects(completed){const today=new Date();today.setHours(0,0,0,0);const distance=p=>{if(!p.deadline)return Infinity;const time=new Date(p.deadline+'T00:00:00').getTime();return Number.isFinite(time)?Math.abs(time-today.getTime()):Infinity;};return db.projects.filter(p=>completed?p.status==='Zaključeno':p.status!=='Zaključeno').slice().sort((a,b)=>{if(!completed){const rank=p=>p.status==='V izdelavi'?0:1;const diff=rank(a)-rank(b);if(diff)return diff;}return distance(a)-distance(b)||(a.deadline||'').localeCompare(b.deadline||'')||(a.name||'').localeCompare(b.name||'','sl');});}
function listRows(items,headers,fn){return items.length?`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${items.map(fn).join('')}</tbody></table></div>`:'<div class="empty">Trenutno ni vnosov. Dodaj prvega z gumbom zgoraj.</div>'}
function moveProjectToTrash(projectId){const index=db.projects.findIndex(p=>p.id===projectId);if(index<0)return;const project=db.projects[index];if(!confirm('Premaknem projekt »'+project.name+'« v koš? Projekt boš lahko obnovil.'))return;db.trash.push({type:'project',deletedAt:new Date().toISOString(),data:clone(project)});db.projects.splice(index,1);save();go('projects');toast('Projekt je v košu.')}

function moveToTrash(type,itemId){if(!['clients','offers','invoices'].includes(type))return;const index=db[type].findIndex(item=>item.id===itemId);if(index<0)return;const item=db[type][index];const label=type==='clients'?item.name:item.number;const linked=type==='clients'&&(db.projects.some(p=>p.client===itemId)||db.offers.some(o=>o.client===itemId)||db.invoices.some(o=>o.client===itemId));if(linked){alert('Stranka je povezana s projektom, ponudbo ali računom. Najprej uredi povezane zapise, da se podatki ne izgubijo.');return;}if(!confirm('Premaknem »'+label+'« v koš? Zapis bo mogoče obnoviti.'))return;if(!Array.isArray(db.trash))db.trash=[];db.trash.push({type,deletedAt:new Date().toISOString(),data:clone(item)});db[type].splice(index,1);save();render();toast('Zapis je v košu.')}
function restoreFromTrash(type,itemId){const index=(db.trash||[]).findIndex(item=>item.type===type&&item.data?.id===itemId);if(index<0||!Array.isArray(db[type]))return;const item=db.trash[index];if(db[type].some(x=>x.id===itemId)){alert('Zapis s tem ID že obstaja.');return;}db[type].push(item.data);db.trash.splice(index,1);save();render();toast('Zapis je obnovljen.')}
function trashPage(){const items=db.trash||[];const labels={project:'Projekt',clients:'Stranka',offers:'Ponudba',invoices:'Račun'};return '<div class="panel"><h2>🗑 Koš – odstranjeni zapisi</h2><p class="help">Zapise lahko obnoviš. Koš se ne prazni samodejno; podatki so shranjeni v tem brskalniku.</p>'+listRows(items,['Vrsta','Naziv / številka','Premaknjeno v koš',''],item=>'<tr><td>'+esc(labels[item.type]||item.type)+'</td><td><b>'+esc(item.type==='project'||item.type==='clients'?item.data.name:item.data.number)+'</b></td><td>'+dateFmt((item.deletedAt||'').slice(0,10))+'</td><td style="text-align:right"><button type="button" class="btn" onclick="'+(item.type==='project'?'restoreProject':'restoreFromTrash')+'('+(item.type==='project'?'':"&#39;"+item.type+"&#39;,")+'&#39;'+item.data.id+'&#39;)">↩ Obnovi</button></td></tr>')+'</div>'}

const views={'project-measurements':projectMeasurementsPage,'project-new':newProjectPage,'project-detail':projectDetail,home,clients:()=>`${headerBtn('Imenik strank',"openForm('clients')")}${listRows(db.clients,['Naziv','E-pošta','Telefon','Naslov',''],x=>`<tr class="project-row" tabindex="0" role="link" onclick="openForm('clients','${x.id}')" onkeydown="if(event.key==='Enter')openForm('clients','${x.id}')"><td><b>${esc(x.name)}</b></td><td>${esc(x.email||'—')}</td><td>${esc(x.phone||'—')}</td><td>${esc(x.address||'—')}</td><td style="text-align:right"><button type="button" class="textbtn" style="font-size:20px" title="Premakni stranko v koš" aria-label="Premakni stranko v koš" onclick="event.stopPropagation();moveToTrash('clients','${x.id}')">🗑️</button></td></tr>`)}`,offers:()=>docList('offers'),invoices:()=>docList('invoices'),projects:()=>`${headerBtn('Delovni nalogi in projekti',"go('project-new')")}<p class="help">Najprej projekti v izdelavi po bližini roka, nato projekti s statusom ?. Zaključeni so v ločeni mapi.</p>${listRows(sortedProjects(false),['Projekt','Stranka','Rok','Vrednost','Status',''],x=>`<tr class="project-row" tabindex="0" role="link" onclick="openProject(&quot;${x.id}&quot;)" onkeydown="if(event.key===&quot;Enter&quot;)openProject(&quot;${x.id}&quot;)"><td><b>${esc(x.name)}</b></td><td>${esc(findClient(x.client))}</td><td>${dateFmt(x.deadline)}</td><td>${fmt(x.budget)}</td><td>${status(x.status)}</td><td style="text-align:right"><button type="button" title="Premakni projekt v koš" aria-label="Premakni projekt v koš" class="textbtn" style="font-size:20px" onclick="event.stopPropagation();moveProjectToTrash('${x.id}')">🗑️</button></td></tr>`)}`, 'completed-projects':()=>`<div class="panel"><h2>✓ Zaključeni projekti</h2><p class="help">Projekti se sem samodejno premaknejo, ko jim nastaviš status Zaključeno. Ostanejo shranjeni in jih lahko ponovno odpreš.</p>${listRows(sortedProjects(true),['Projekt','Stranka','Rok','Vrednost','Status',''],x=>`<tr class="project-row" tabindex="0" role="link" onclick="openProject(&quot;${x.id}&quot;)" onkeydown="if(event.key===&quot;Enter&quot;)openProject(&quot;${x.id}&quot;)"><td><b>${esc(x.name)}</b></td><td>${esc(findClient(x.client))}</td><td>${dateFmt(x.deadline)}</td><td>${fmt(x.budget)}</td><td>${status(x.status)}</td><td style="text-align:right"><button type="button" title="Premakni projekt v koš" aria-label="Premakni projekt v koš" class="textbtn" style="font-size:20px" onclick="event.stopPropagation();moveProjectToTrash('${x.id}')">🗑️</button></td></tr>`)}</div>`,trash:trashPage,expenses:()=>`${headerBtn('Prejeti računi in stroški',"openForm('expenses')")}${listRows(db.expenses,['Datum','Dobavitelj','Vrsta','Opis','Znesek',''],x=>`<tr><td>${dateFmt(x.date)}</td><td><b>${esc(x.supplier)}</b></td><td>${esc(x.category)}</td><td>${esc(x.desc)}</td><td>${fmt(x.amount)}</td><td><button class="textbtn" onclick="openForm('expenses','${x.id}')">Uredi</button></td></tr>`)}`,stock:()=>`${headerBtn('Zaloga materiala',"openForm('stock')")}${listRows(db.stock,['Material','Količina','Min. zaloga','Cena / enoto','Vrednost',''],x=>`<tr><td><b>${esc(x.name)}</b></td><td>${Number(x.qty)} ${esc(x.unit)}</td><td>${Number(x.minimum)} ${esc(x.unit)}</td><td>${fmt(x.price)}</td><td>${fmt(x.qty*x.price)}</td><td><button class="textbtn" onclick="openForm('stock','${x.id}')">Uredi</button></td></tr>`)}`,reports,settings};
function docList(type){let arr=db[type],name=type==='offers'?'ponudb':'računov';return `${headerBtn('Pregled '+name,`openForm('${type}')`)}${listRows(arr,['Številka','Stranka','Datum','Znesek brez DDV','Z DDV','Status',''],x=>`<tr class="project-row" tabindex="0" role="link" onclick="openForm('${type}','${x.id}')" onkeydown="if(event.key==='Enter')openForm('${type}','${x.id}')"><td><b>${esc(x.number)}</b></td><td>${esc(findClient(x.client))}</td><td>${dateFmt(x.date)}</td><td>${fmt(x.amount)}</td><td>${fmt(totalDoc(x))}</td><td>${status(x.status)}</td><td style="text-align:right"><button type="button" class="textbtn" style="font-size:20px" title="Premakni v koš" aria-label="Premakni v koš" onclick="event.stopPropagation();moveToTrash('${type}','${x.id}')">🗑️</button></td></tr>`)}`}
function reports(){let income=sum(db.invoices.filter(x=>x.status==='Plačano'),x=>x.amount),cost=sum(db.expenses,x=>x.amount),exposure=sum(db.invoices.filter(x=>x.status!=='Plačano'),x=>x.amount),inv=sum(db.stock,x=>x.qty*x.price),max=Math.max(income,cost,1);return `<div class="report"><div class="panel"><h2>Operativni pregled (informativno)</h2><div class="bars"><div class="barrow"><b>Prihodki*</b><div class="bar"><span style="width:${income/max*100}%"></span></div><small>${fmt(income)}</small></div><div class="barrow"><b>Stroški**</b><div class="bar"><span style="width:${cost/max*100}%;background:#d3a45e"></span></div><small>${fmt(cost)}</small></div></div><h2 style="margin-top:25px">Razlika prikazanih zneskov: ${fmt(income-cost)}</h2><p class="help">* Plačani osnutki računov brez DDV. ** Vneseni stroški, brez razločevanja davčne osnove in DDV. Rezultat ni dobiček podjetja ali računovodska bilanca.</p></div><div class="panel"><h2>Drugi kazalniki</h2><p>Neplačani osnutki brez DDV: <b>${fmt(exposure)}</b></p><p>Ocenjena vrednost zaloge: <b>${fmt(inv)}</b></p><p>Število projektov: <b>${db.projects.length}</b></p><p>Število strank: <b>${db.clients.length}</b></p><p class="help">Za uradno bilanco so potrebni dvostavno knjigovodstvo, kontni načrt, obračuni, knjiženje in kontrola.</p></div></div>`}
function settings(){let c=db.company;return `<div class="panel"><h2>Podatki podjetja</h2><form onsubmit="saveSettings(event)" class="formgrid"><label class="field span2">Naziv podjetja<input name="name" value="${esc(c.name)}" required></label><label class="field">Naslov<input name="address" value="${esc(c.address)}"></label><label class="field">Davčna številka / ID za DDV<input name="tax" value="${esc(c.tax)}"></label><label class="field">IBAN<input name="iban" value="${esc(c.iban)}"></label><label class="field">E-pošta<input name="email" value="${esc(c.email)}"></label><label class="field">Telefon<input name="phone" value="${esc(c.phone)}"></label><label class="field">Privzeti DDV (%)<input name="defaultVat" type="number" min="0" max="100" step="0.1" value="${esc(c.defaultVat)}"></label><div class="span2"><button class="btn primary">Shrani podatke</button></div></form></div><div class="panel spaced"><h2>Podatki in varnostne kopije</h2><p class="muted">Podatki niso v oblaku. Če počistiš brskalnik ali zamenjaš napravo, lahko izginejo.</p><div class="actions"><button class="btn primary" onclick="exportData()">↓ Izvozi podatke JSON</button><button class="btn" onclick="document.getElementById('importfile').click()">↑ Uvozi JSON</button><input type="file" id="importfile" accept="application/json,.json" style="display:none" onchange="importData(event)"><button class="btn danger" onclick="resetDemo()">Ponastavi demo</button></div></div>`}
function saveSettings(e){e.preventDefault();db.company=Object.fromEntries(new FormData(e.target));db.company.defaultVat=Number(db.company.defaultVat);save();toast('Podatki shranjeni.');render()}
const fields={clients:[['name','Ime / naziv','text',1],['email','E-pošta','email'],['phone','Telefon','tel'],['address','Naslov','text'],['tax','Davčna številka','text']],projects:[['name','Naziv projekta','text',1],['clientName','Ime in priimek / naziv stranke','text',1],['clientPhone','Telefon stranke','tel'],['clientEmail','E-pošta stranke','email'],['clientAddress','Naslov stranke','text'],['objectLocation','Kraj objekta / lokacija del','text'],['clientTax','Davčna številka stranke','text'],['deadline','Predviden rok','date'],['budget','Predvidena vrednost (€)','number'],['status','Status','select:?|V izdelavi|Zaključeno'],['notes','Opombe','textarea']],expenses:[['date','Datum','date',1],['supplier','Dobavitelj','text',1],['category','Kategorija','select:Material|Stroji|Prevoz|Plače|Najemnina|Energija|Drugo'],['desc','Opis stroška','text'],['amount','Znesek (€)','number',1]],stock:[['name','Material','text',1],['unit','Enota','select:m²|kos|m|kg'],['qty','Količina','number',1],['minimum','Minimalna zaloga','number'],['price','Nabavna cena za enoto (€)','number']]};
function fieldHTML(f,v){let [k,label,type,req]=f,value=v?.[k]??(type==='date'?today():'');if(type==='client')return `<label class="field">${label}<select name="${k}" required><option value="">Izberi stranko</option>${db.clients.map(c=>`<option value="${c.id}" ${value===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`;if(type==='textarea')return `<label class="field span2">${label}<textarea name="${k}">${esc(value)}</textarea></label>`;if(type.startsWith('select:'))return `<label class="field">${label}<select name="${k}">${type.slice(7).split('|').map(s=>`<option ${value===s?'selected':''}>${esc(s)}</option>`).join('')}</select></label>`;return `<label class="field">${label}<input name="${k}" type="${type}" value="${esc(value)}" ${req?'required':''} ${type==='number'?'step="0.01"':''}></label>`}
function openProject(projectId){if(!db.projects.some(x=>x.id===projectId)){toast('Projekta ni mogoče najti');return}selectedProjectId=projectId;page='project-detail';render();scrollTo(0,0)}

const measurementTemplates=["PARADISO","HIMALAJA","IMPALA","LABRADOR","NERO Belfast","NERO Kitajc","NERO Pretoria","OLIVA","POLICE ena debelina","POLICE VEČ DEBELIN","VISCONT WHITE"];
let draftMeasurements={};
function measurementPicker(){const selected=Object.keys(draftMeasurements)[0];return '<section class="measurement-section"><h2>Izmere – Excelove predloge</h2>'+(selected?'<div class="sectiontop"><h3>Izbrana predloga: '+esc(selected)+'</h3><button type="button" class="btn" onclick="changeMeasurementTemplate()">Zamenjaj predlogo</button></div>':'<p class="help">Izberi eno predlogo za ta projekt.</p><div class="measurement-choices">'+measurementTemplates.map(n=>'<button type="button" class="btn measurement-choice" onclick="selectMeasurementTemplate(decodeURIComponent(\''+encodeURIComponent(n)+'\'))">'+esc(n)+'</button>').join('')+'</div>')+'<div id="measurement-editors">'+measurementEditors(draftMeasurements)+'</div></section>'}
function selectMeasurementTemplate(n){draftMeasurements={[n]:draftMeasurements[n]||{rows:[]}};refreshMeasurementPicker();if(page==='project-measurements')saveProjectMeasurements(false)}
function changeMeasurementTemplate(){if(!confirm('Zamenjava predloge odstrani izmere trenutne predloge iz tega projekta. Nadaljujem?'))return;draftMeasurements={};refreshMeasurementPicker();if(page==='project-measurements')saveProjectMeasurements(false)}
function refreshMeasurementPicker(){const el=document.querySelector('.measurement-section');if(el)el.outerHTML=measurementPicker()}
function toggleMeasurementTemplate(el,n){selectMeasurementTemplate(n)}
function measurementArea(r){return ((Number(String(r.length||0).replace(',','.'))||0)*(Number(String(r.width||0).replace(',','.'))||0)*(Number(String(r.qty||0).replace(',','.'))||0))/10000}
function measurementEditors(templates){return Object.entries(templates||{}).map(([n,t])=>'<section class="measurement-editor"><h3>'+esc(n)+'</h3><p class="help">Mere vpisuj v centimetrih (cm), površina se izračuna v m².</p><div class="tablewrap"><table><thead><tr><th>Element</th><th>Dolžina (cm)</th><th>Širina (cm)</th><th>Kosov</th><th>Skupaj (m²)</th><th></th></tr></thead><tbody>'+((t.rows||[]).map((r,i)=>measurementRow(n,r,i)).join(''))+'</tbody></table></div><div style="padding:10px;background:#f4f6f8;margin:8px 0 12px">Skupaj kvadratnih metrov: <b class="measurement-total">'+(t.rows||[]).reduce((sum,r)=>sum+measurementArea(r),0).toFixed(3)+'</b> m²</div><button type="button" class="btn" onclick="addMeasurementRow(decodeURIComponent(\''+encodeURIComponent(n)+'\'))">+ Dodaj vrstico</button></section>').join('')}
function measurementRow(n,r,i){return '<tr><td><input aria-label="Element" value="'+esc(r.name||'')+'" onchange="changeMeasurement(decodeURIComponent(\''+encodeURIComponent(n)+'\'),'+i+',\'name\',this.value)"></td>'+['length','width','qty'].map(k=>'<td><div style="display:flex;align-items:center;gap:4px"><input style="width:82px;min-width:0" type="text" inputmode="decimal" aria-label="'+(k==='length'?'Dolžina':k==='width'?'Širina':'Kosov')+'" value="'+esc(r[k]??'')+'" oninput="changeMeasurement(decodeURIComponent(\''+encodeURIComponent(n)+'\'),'+i+',\''+k+'\',this.value)">'+(k==='qty'?'':'<span>cm</span>')+'</div></td>').join('')+'<td>'+measurementArea(r).toFixed(3)+'</td><td><button type="button" class="textbtn" onclick="removeMeasurementRow(decodeURIComponent(\''+encodeURIComponent(n)+'\'),'+i+')">Odstrani</button></td></tr>'}
function addMeasurementRow(n){draftMeasurements[n].rows.push({name:'',length:'',width:'',qty:1});document.getElementById('measurement-editors').innerHTML=measurementEditors(draftMeasurements);if(page==='project-measurements')saveProjectMeasurements(false)}
function removeMeasurementRow(n,i){draftMeasurements[n].rows.splice(i,1);document.getElementById('measurement-editors').innerHTML=measurementEditors(draftMeasurements);if(page==='project-measurements')saveProjectMeasurements(false)}
function changeMeasurement(n,i,k,v){draftMeasurements[n].rows[i][k]=v;const table=document.getElementById('measurement-editors');const tr=table?.querySelectorAll('.measurement-editor')[Object.keys(draftMeasurements).indexOf(n)]?.querySelectorAll('tbody tr')[i];if(tr){const r=draftMeasurements[n].rows[i];tr.children[4].textContent=measurementArea(r).toFixed(3);const total=tr.closest('.measurement-editor')?.querySelector('.measurement-total');if(total)total.textContent=(draftMeasurements[n].rows||[]).reduce((sum,row)=>sum+measurementArea(row),0).toFixed(3)}if(page==='project-measurements')saveProjectMeasurements(false)}

function projectMeasurementsPage(){const p=db.projects.find(x=>x.id===selectedProjectId);if(!p)return '<div class="panel">Projekt ni najden.</div>';return '<div class="panel"><div class="sectiontop"><h2>Izmere: '+esc(p.name)+'</h2><div class="actions"><button type="button" class="btn" onclick="printProjectMeasurements(true)">🖨 Natisni izmere</button><button type="button" class="btn" onclick="saveProjectMeasurements(true)">Shrani in nazaj</button></div></div>'+measurementPicker()+'<footer><button class="btn primary" onclick="saveProjectMeasurements(true)">Shrani izmere</button></footer></div>'}
function printProjectMeasurements(useDraft){const p=db.projects.find(x=>x.id===selectedProjectId);if(!p)return;const c=db.clients.find(x=>x.id===p.client)||{};if(useDraft)saveProjectMeasurements(false);const data=useDraft?draftMeasurements:(p.measurements||{});if(!Object.keys(data).length){alert('Najprej izberi predlogo in vnesi mere.');return;}const holder=document.createElement('div');holder.innerHTML=measurementEditors(data);holder.querySelectorAll('input,select,textarea').forEach(el=>{const span=document.createElement('span');span.textContent=el.tagName==='SELECT'?el.options[el.selectedIndex]?.textContent||'':el.value;el.replaceWith(span)});holder.querySelectorAll('button,.help').forEach(el=>el.remove());const name=esc(c.name||p.clientName||'—'),place=esc(p.objectLocation||'—');const html='<!doctype html><html lang="sl"><head><meta charset="utf-8"><title>Izmere - '+name+'</title><style>@page{size:A4;margin:13mm}body{font:12px Arial,sans-serif;color:#1d2935}header{border-bottom:2px solid #263e51;margin-bottom:16px;padding-bottom:12px}h1{font-size:21px;margin:0 0 8px}h2{font-size:16px}h3{font-size:15px;margin:15px 0 8px}h4{font-size:13px;margin:12px 0 6px}table{width:100%;border-collapse:collapse;margin:8px 0 12px}th,td{border:1px solid #cbd3d9;padding:5px 7px;text-align:left}th{background:#edf1f4}.measurement-editor{margin-bottom:20px}.tablewrap{overflow:visible}.impala-measures table{width:100%!important}.measurement-editor>div{break-inside:avoid}section{break-inside:auto}tr{break-inside:avoid}button{display:none}span{font-weight:normal}b,strong{font-weight:700}</style></head><body><header><h1>IZMERE – '+name+'</h1><div><b>Stranka:</b> '+name+'</div><div><b>Kraj objekta:</b> '+place+'</div></header>'+holder.innerHTML+'<script>window.onload=function(){window.print()}<\/script></body></html>';const w=window.open('','_blank');if(!w){alert('Brskalnik je blokiral okno za tiskanje. Dovoli pojavna okna.');return;}w.document.open();w.document.write(html);w.document.close();}
function editProjectMeasurements(){const p=db.projects.find(x=>x.id===selectedProjectId);if(!p)return;draftMeasurements=JSON.parse(JSON.stringify(p.measurements||{}));page='project-measurements';render();scrollTo(0,0)}
function saveProjectMeasurements(back){const p=db.projects.find(x=>x.id===selectedProjectId);if(!p)return;p.measurements=JSON.parse(JSON.stringify(draftMeasurements));save();if(back){page='project-detail';render();scrollTo(0,0);toast('Izmere shranjene')}}
function newProjectPage(){return `<div class="panel"><div class="sectiontop"><h2>Dodaj nov projekt</h2><button type="button" class="btn" onclick="go('projects')">← Nazaj na projekte</button></div><form id="editor" onsubmit="submitSimple(event,'projects','')"><div class="formgrid">${fields.projects.map(f=>fieldHTML(f,{})).join('')}</div>${measurementPicker()}<footer><button type="button" class="btn" onclick="go('projects')">Prekliči</button><button type="submit" class="btn primary">Shrani projekt</button></footer></form></div>`}
function projectDetail(){const p=db.projects.find(x=>x.id===selectedProjectId);if(!p)return '<div class="panel">Projekt ni najden.</div>';const c=db.clients.find(x=>x.id===p.client);const cell=(label,value,wide=false)=>'<div class="'+(wide?'wide':'')+'"><small>'+label+'</small><b>'+esc(value??'—')+'</b></div>';return '<div class="panel"><div class="sectiontop"><button class="btn" onclick="go(&quot;projects&quot;)">← Nazaj na projekte</button><button class="btn primary" onclick="openForm(&quot;projects&quot;,selectedProjectId)">Uredi projekt</button></div><h2>'+esc(p.name)+'</h2><div class="project-detail">'+cell('Stranka',c?.name)+cell('Telefon',c?.phone||'—')+cell('E-pošta',c?.email||'—')+cell('Naslov',c?.address||'—')+cell('Kraj objekta',p.objectLocation||'—')+cell('Davčna številka',c?.tax||'—')+cell('Predviden rok',dateFmt(p.deadline))+cell('Predvidena vrednost',fmt(p.budget))+cell('Status',p.status)+cell('Opombe',p.notes||'—',true)+'</div></div>'+(p.measurements?'<div class="panel"><div class="sectiontop"><h2>Izmere projekta</h2><div class="actions"><button class="btn" onclick="printProjectMeasurements(false)">🖨 Natisni izmere</button><button class="btn primary" onclick="editProjectMeasurements()">Uredi izmere</button></div></div>'+Object.entries(p.measurements).map(([n,t])=>'<h3>'+esc(n)+'</h3><div class="tablewrap"><table><thead><tr><th>Element</th><th>Dolžina</th><th>Širina</th><th>Kosov</th><th>m²</th></tr></thead><tbody>'+(t.rows||[]).map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.length)+'</td><td>'+esc(r.width)+'</td><td>'+esc(r.qty)+'</td><td>'+(((+r.length||0)*(+r.width||0)*(+r.qty||0))/10000).toFixed(3)+'</td></tr>').join('')+'</tbody></table></div>').join('')+'</div>':'')}
function openForm(type,edit=''){if(type==='offers'||type==='invoices'){openDoc(type,edit);return}let o=db[type].find(x=>x.id===edit)||{};if(type==='projects'){let c=db.clients.find(c=>c.id===o.client);o={...o,clientName:c?.name||'',clientPhone:c?.phone||'',clientEmail:c?.email||'',clientAddress:c?.address||'',clientTax:c?.tax||''}}let title={clients:'stranko',projects:'projekt',expenses:'strošek',stock:'material'}[type];showModal(`<h2>${edit?'Uredi':'Dodaj'} ${title}</h2><form id="editor" onsubmit="submitSimple(event,'${type}','${edit}')"><div class="formgrid">${fields[type].map(f=>fieldHTML(f,o)).join('')}</div><footer><button type="button" class="btn" onclick="closeModal()">Prekliči</button><button class="btn primary" type="submit">Shrani</button></footer></form>`) }
function submitSimple(e,type,edit){e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));['amount','budget','qty','minimum','price'].forEach(k=>{if(k in obj)obj[k]=Number(obj[k])||0});if(type==='projects'&&page==='project-new')obj.measurements=JSON.parse(JSON.stringify(draftMeasurements));if(type==='projects'){const name=(obj.clientName||'').trim();if(!name){alert('Vpiši ime ali naziv stranke.');return}const phone=(obj.clientPhone||'').trim(),email=(obj.clientEmail||'').trim(),address=(obj.clientAddress||'').trim(),tax=(obj.clientTax||'').trim();const existingProject=edit?db.projects.find(p=>p.id===edit):null;let client=existingProject?db.clients.find(c=>c.id===existingProject.client):null;const normalized=x=>(x||'').trim().toLocaleLowerCase('sl');if(!client||normalized(client.name)!==normalized(name)){client=db.clients.find(c=>normalized(c.name)===normalized(name)&&(phone?normalized(c.phone)===normalized(phone):true))}if(!client){client={id:id(),name,phone,email,address,tax};db.clients.push(client)}else{for(const [k,v] of Object.entries({phone,email,address,tax})){if(v&&!client[k])client[k]=v}}obj.client=client.id;for(const k of ['clientName','clientPhone','clientEmail','clientAddress','clientTax'])delete obj[k]}if(edit){Object.assign(db[type].find(x=>x.id===edit),obj)}else {const newId=id();db[type].push({id:newId,...obj});if(type==='projects'&&page==='project-new'){selectedProjectId=newId;page='project-detail'}}save();closeModal();render();toast('Vnos shranjen')}
function showModal(html){closeModal();const w=document.createElement('div');w.id='overlay';w.className='modalwrap';w.innerHTML=`<div class="modal">${html}</div>`;w.addEventListener('click',e=>{if(e.target===w)closeModal()});document.body.appendChild(w)}function closeModal(){document.getElementById('overlay')?.remove()}

function shelfTotals(sec){let area=0,edge=0;for(const r of sec.rows){const l=n(r.length),w=n(r.width),q=n(r.qty);area+=l*w*q/10000;edge+=l*q/100;}return {area,edge,cost:area*n(sec.surface)+edge*n(sec.edge)};}
function renderShelves(t,name){const data=shelfData(t,name);let sum=0;let html='<section class="measurement-editor impala-original shelf-editor"><h3>NALOG '+safe(name)+'</h3><p class="help">Mere v centimetrih. Cena površine je na m², cena robov na tekoči meter.</p>';data.forEach((sec,si)=>{const totals=shelfTotals(sec);sum+=totals.cost;html+='<h4 style="padding:9px;background:#e8eef3;margin-top:15px">'+safe(shelfDefaults[name][si].title)+'</h4><div class="tablewrap impala-measures"><table><thead><tr><th>Dolžina (cm)</th><th>Širina (cm)</th><th>Kosov</th><th>Skupaj (m²)</th><th>Rob (m)</th><th></th></tr></thead><tbody>';sec.rows.forEach((r,ri)=>{html+='<tr>'+['length','width','qty'].map(k=>'<td><div style="display:flex;align-items:center;gap:4px"><input style="width:72px" type="text" inputmode="decimal" value="'+safe(r[k]??'')+'" onchange="shelfChange('+si+','+ri+',\''+k+'\',this.value)">'+(k==='qty'?'':'<span>cm</span>')+'</div></td>').join('')+'<td>'+(n(r.length)*n(r.width)*n(r.qty)/10000).toFixed(3)+'</td><td>'+(n(r.length)*n(r.qty)/100).toFixed(3)+'</td><td><button type="button" class="textbtn" onclick="shelfRemove('+si+','+ri+')">Odstrani</button></td></tr>';});html+='</tbody></table></div><button type="button" class="btn" onclick="shelfAdd('+si+')">+ Dodaj vrstico</button><div style="padding:10px;background:#f4f6f8;margin-top:8px">Skupaj kvadratnih metrov: <b>'+totals.area.toFixed(3)+'</b> m² · Skupaj robov: <b>'+totals.edge.toFixed(3)+'</b> m</div><div style="padding:10px;background:#f4f6f8">Cena m²: <input type="text" inputmode="decimal" style="width:75px" value="'+safe(sec.surface)+'" onchange="shelfRate('+si+',\'surface\',this.value)"> € · Cena robov / m: <input type="text" inputmode="decimal" style="width:75px" value="'+safe(sec.edge)+'" onchange="shelfRate('+si+',\'edge\',this.value)"> € · Vrednost: <b>'+totals.cost.toFixed(2)+'</b> €</div>';});const c=sheet(t),manufacture=c.manufacturePrice===undefined?800:n(c.manufacturePrice),vat=String(c.vatRate)==='9.5'?9.5:22;html+='<div style="padding:15px;background:#e5f0e8;margin-top:14px">Material in robovi: <b>'+sum.toFixed(2)+'</b> €</div><div style="padding:15px;background:#f4f6f8;margin-top:10px">Cena izdelave: <select onchange="shelfSettings(\'manufacturePrice\',this.value)">'+[0,...Array.from({length:19},(_,i)=>100+i*50)].map(v=>'<option value="'+v+'"'+(manufacture===v?' selected':'')+'>'+v+' €</option>').join('')+'</select></div><div style="padding:15px;background:#e5f0e8;margin-top:10px">Cena brez DDV: <b>'+(sum+manufacture).toFixed(2)+'</b> €</div><div style="padding:15px;background:#f4f6f8;margin-top:10px">DDV: <select onchange="shelfSettings(\'vatRate\',this.value)">'+[22,9.5].map(v=>'<option value="'+v+'"'+(vat===v?' selected':'')+'>'+v+' %</option>').join('')+'</select> · Znesek DDV: <b>'+((sum+manufacture)*vat/100).toFixed(2)+'</b> €</div><div style="padding:15px;background:#e5f0e8;margin-top:10px">Cena z DDV: <b>'+((sum+manufacture)*(1+vat/100)).toFixed(2)+'</b> €</div></section>';return html;}
function shelfActive(){const name=Object.keys(draftMeasurements)[0];const t=draftMeasurements[name];return t&&shelfDefaults[name]?{name,t,data:shelfData(t,name)}:null;}
function shelfRefresh(){const el=document.getElementById('measurement-editors');if(el)el.innerHTML=measurementEditors(draftMeasurements);if(page==='project-measurements')saveProjectMeasurements(false);}
window.shelfChange=function(si,ri,k,v){const x=shelfActive();if(!x)return;x.data[si].rows[ri][k]=v;shelfRefresh();};
window.shelfAdd=function(si){const x=shelfActive();if(!x)return;x.data[si].rows.push({length:'',width:'',qty:1});shelfRefresh();};
window.shelfRemove=function(si,ri){const x=shelfActive();if(!x)return;x.data[si].rows.splice(ri,1);shelfRefresh();};
window.shelfRate=function(si,k,v){const x=shelfActive();if(!x)return;x.data[si][k]=v;shelfRefresh();};
window.shelfSettings=function(k,v){const x=shelfActive();if(!x)return;sheet(x.t)[k]=v;shelfRefresh();};

measurementEditors=function(templates){return Object.entries(templates||{}).map(([name,t])=>stoneRates[name]?renderImpala(t,name):shelfDefaults[name]?renderShelves(t,name):originalEditor({[name]:t})).join("");};
const oldSelect=selectMeasurementTemplate;
selectMeasurementTemplate=function(name){oldSelect(name);};
render();
impalaRemoveSpinners();
})();
</script><script>
(function(){
  function removeImpalaNumberArrows(){
    document.querySelectorAll('.impala-original input[type="number"]').forEach(function(el){
      el.setAttribute('type','text');
      el.setAttribute('inputmode','decimal');
      el.removeAttribute('step');
    });
  }
  document.addEventListener('focusin',function(e){
    if(e.target.closest('.impala-original'))removeImpalaNumberArrows();
  },true);
  new MutationObserver(removeImpalaNumberArrows).observe(document.documentElement,{childList:true,subtree:true});
  removeImpalaNumberArrows();
})();
</script></body></html>
