const key='zagorc_demo_v1';const sample={clients:[{id:'c1',name:'Vzorčna stranka – Janez Novak',email:'primer@example.com',phone:'',address:'Primer naslov, Slovenija',tax:''},{id:'c2',name:'Vzorčna stranka – Podjetje d.o.o.',email:'',phone:'',address:'',tax:''}],offers:[{id:'o1',number:'P-2026-001',client:'c1',date:'2026-11-12',due:'2026-12-12',desc:'Nagrobni spomenik – granit Impala',amount:1800,vat:22,status:'Osnutek',items:[{desc:'Izdelava in montaža spomenika – Impala',qty:1,price:1800}]}],invoices:[],projects:[{id:'p1',name:'Vzorčni spomenik Impala',client:'c1',status:'V izdelavi',budget:1800,deadline:'2026-12-10',notes:'Primer projekta'}],expenses:[{id:'e1',date:'2026-11-10',supplier:'Vzorčni dobavitelj',category:'Material',desc:'Granit Impala (primer)',amount:420}],stock:[{id:'s1',name:'Granit Impala',unit:'m²',qty:16,minimum:5,price:105},{id:'s2',name:'Granit New Cristal',unit:'m²',qty:8,minimum:4,price:98}],company:{name:'Kamnoseštvo Zagorc / ZAGI TEAM d.o.o.',address:'',tax:'',iban:'',email:'',phone:'',defaultVat:22}};
const clone=o=>JSON.parse(JSON.stringify(o));let db;try{db=JSON.parse(localStorage.getItem(key))||clone(sample)}catch(e){db=clone(sample)};if(!Array.isArray(db.trash))db.trash=[];if(!Array.isArray(db.calendarTasks))db.calendarTasks=[];let page='home',selectedProjectId='',modal='',docType='offers',docItems=[];const moneyNumber=n=>new Intl.NumberFormat('de-DE',{useGrouping:true,minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0);const moneyParse=v=>{let x=String(v??'').trim().replace(/\s/g,'').replace(/€/g,'');if(x.includes(','))x=x.replace(/\./g,'').replace(',','.');return Number(x)||0};const fmt=n=>moneyNumber(n)+' €',dateFmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('sl-SI'):'—';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const findClient=id=>db.clients.find(x=>x.id===id)?.name||'Neznana stranka';const save=()=>{try{localStorage.setItem(key,JSON.stringify(db))}catch(e){toast('Shranjevanje ni uspelo – izvozi varnostno kopijo.')}};const id=()=>Math.random().toString(36).slice(2,10);const today=()=>new Date().toISOString().slice(0,10);const totalDoc=o=>o.amount*(1+(Number(o.vat)||0)/100);const sum=(arr,fn)=>arr.reduce((a,x)=>a+(Number(fn(x))||0),0);function toast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display='none',3000)}
function syncOverdueInvoices(){const d=today();let changed=false;for(const x of db.invoices){const due=x.dueDate||(/^\d{4}-\d{2}-\d{2}$/.test(x.due||'')?x.due:'');if(due&&due<d&&x.status!=='Plačano'&&x.status!=='Osnutek'&&x.status!=='Zamuda'){x.status='Zamuda';changed=true}}if(changed)save()}
function render(){syncOverdueInvoices();document.getElementById('nav').innerHTML=tabs.map(([k,n,i])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span class="emoji">${i}</span>${n}</button>`).join('');let title=page.startsWith('summary-')?({'summary-paid':'Plačani računi','summary-expenses':'Stroški','summary-sent':'Izdani neplačani računi','summary-unpaid':'Neplačani poslani računi'}[page]):page==='expense-detail'?'Strošek':page==='offer-detail'?(docType==='invoices'?'Račun':'Ponudba'):page==='project-measurements'?'Urejanje izmer':page==='project-new'?'Nov projekt':page==='project-detail'?(db.projects.find(p=>p.id===selectedProjectId)?.name||'Projekt'):page==='client-detail'?(db.clients.find(c=>c.id===selectedClientId)?.name||'Stranka'):(tabs.find(x=>x[0]===page)?.[1]||'Domov');document.getElementById('app').innerHTML=`<header class="top"><div><div class="eyebrow">KAMNOSEŠTVO ZAGORC / POSLOVANJE</div><h1>${esc(title)}</h1><p class="subtitle">Vsi podatki podjetja na enem mestu.</p></div><span class="chip">● DEMO</span></header><div class="notice">To je preizkusna različica z vzorčnimi podatki. Ustvarjeni dokumenti so <b>osnutki</b>, ne davčno potrjeni računi ali uradne računovodske evidence.</div>${views[page]() }<div class="disclaimer">ZAGORC · Prototip v1 · Shranjevanje v brskalniku. Za poslovno uporabo je potrebna varna strežniška različica.</div>`;if(document.querySelector('.project-attachment-list'))refreshProjectAttachments();}

function projectSearchText(p){const c=db.clients.find(x=>x.id===p.client)||{};return [p.name,p.objectLocation,p.address,p.notes,p.id,p.number,p.phone,p.clientName,c.name,c.address,c.phone,c.email].filter(Boolean).join(' ').toLocaleLowerCase('sl');}
function filterProjectRows(input){const q=input.value.trim().toLocaleLowerCase('sl').normalize('NFD').replace(/[\u0300-\u036f]/g,'');const area=input.parentElement.parentElement;let shown=0;area.querySelectorAll('tr[data-project-search]').forEach(row=>{const content=(row.getAttribute('data-project-search')||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');const match=!q||content.includes(q);row.style.display=match?'':'none';if(match)shown++;});let empty=area.querySelector('.project-search-empty');if(!empty){empty=document.createElement('p');empty.className='project-search-empty help';empty.textContent='Ni projektov, ki ustrezajo iskanju.';input.parentElement.insertAdjacentElement('afterend',empty);}empty.style.display=shown===0&&q?'':'none';}
function projectPriceLabel(p,withVat){if(typeof window.zagorcMeasurementPrice==='function'&&Object.keys(p.measurements||{}).length)return moneyNumber(window.zagorcMeasurementPrice(p.measurements,withVat))+' €';const templates=Object.entries(p.measurements||{});if(!templates.length)return '—';let net=0,gross=0;const primary=templates[templates.length-1]?.[0];let primaryVat=22;for(const [name,t] of templates){if(!t)continue;let amount=0,vat=22;if(name==='PRAZEN LIST'){amount=Number(String(t.price||'').replace(',','.'))||0;vat=Number(t.vatRate)||22;net+=amount;if(name===primary)primaryVat=vat;continue;}if(name.startsWith('POLICE')){const defaults=name==='POLICE ena debelina'?[{surface:110,edge:10}]:[{surface:100,edge:10},{surface:110,edge:10}];const data=t.shelfSections||defaults.map((d,i)=>({...d,rows:i===0?(t.rows||[]):[]}));for(const sec of data){let area=0,edge=0;for(const r of sec.rows||[]){const l=Number(String(r.length||'').replace(',','.'))||0,w=Number(String(r.width||'').replace(',','.'))||0,q=Number(String(r.qty||'').replace(',','.'))||0;area+=l*w*q/10000;edge+=l*q/100;}amount+=area*(Number(sec.surface)||0)+edge*(Number(sec.edge)||0);}vat=String(t.impalaCells?.vatRate)==='9.5'?9.5:22;}else if(t.impalaCells){const c=t.impalaCells;const ranges=[['F','G',4,13,'C14',110],['E','F',17,26,'C27',100],['E','F',30,39,'C40',100],['E','F',43,52,'C53',100]];if(typeof stoneRates!=='undefined'&&stoneRates[name]){ranges.forEach((r,i)=>r[5]=stoneRates[name][i]||r[5]);}for(let i=0;i<ranges.length;i++){const [a,b,from,to,price,defaultRate]=ranges[i];let total=0;for(let j=from;j<=to;j++){const x=Number(String(c[a+j]||'').replace(',','.'))||0,y=Number(String(c[b+j]||'').replace(',','.'))||0,z=i===0?1:(Number(String(c['G'+j]||'').replace(',','.'))||0);total+=i===0?x*y/100:x*y*z/10000;}amount+=total*(c[price]===undefined?defaultRate:Number(String(c[price]).replace(',','.'))||0);}if(name===primary)amount+=c.manufacturePrice===undefined?800:Number(c.manufacturePrice)||0;vat=String(c.vatRate)==='9.5'?9.5:22;}else continue;net+=amount;if(name===primary)primaryVat=vat;}gross=net*(1+primaryVat/100);return moneyNumber(withVat?gross:net)+' €';}
function sortedProjects(completed){const today=new Date();today.setHours(0,0,0,0);const distance=p=>{if(!p.deadline)return Infinity;const time=new Date(p.deadline+'T00:00:00').getTime();return Number.isFinite(time)?Math.abs(time-today.getTime()):Infinity;};return db.projects.filter(p=>completed?p.status==='Zaključeno':p.status!=='Zaključeno').slice().sort((a,b)=>{if(!completed){const rank=p=>p.status==='V izdelavi'?0:1;const diff=rank(a)-rank(b);if(diff)return diff;}return distance(a)-distance(b)||(a.deadline||'').localeCompare(b.deadline||'')||(a.name||'').localeCompare(b.name||'','sl');});}

function moveProjectToTrash(projectId){const index=db.projects.findIndex(p=>p.id===projectId);if(index<0)return;const project=db.projects[index];if(!confirm('Premaknem projekt »'+project.name+'« v koš? Projekt boš lahko obnovil.'))return;db.trash.push({type:'project',deletedAt:new Date().toISOString(),data:clone(project)});db.projects.splice(index,1);save();go('projects');toast('Projekt je v košu.')}

function moveToTrash(type,itemId){if(!['clients','offers','invoices','expenses'].includes(type))return;const index=db[type].findIndex(item=>item.id===itemId);if(index<0)return;const item=db[type][index];const label=type==='clients'?item.name:type==='expenses'?(item.desc||item.supplier||'Strošek'):item.number;const linked=type==='clients'&&(db.projects.some(p=>p.client===itemId)||db.offers.some(o=>o.client===itemId)||db.invoices.some(o=>o.client===itemId));if(linked){alert('Stranka je povezana s projektom, ponudbo ali računom. Najprej uredi povezane zapise, da se podatki ne izgubijo.');return;}if(!confirm('Premaknem »'+label+'« v koš? Zapis bo mogoče obnoviti.'))return;if(!Array.isArray(db.trash))db.trash=[];db.trash.push({type,deletedAt:new Date().toISOString(),data:clone(item)});db[type].splice(index,1);save();render();toast('Zapis je v košu.')}
function restoreFromTrash(type,itemId){const index=(db.trash||[]).findIndex(item=>item.type===type&&item.data?.id===itemId);if(index<0||!Array.isArray(db[type]))return;const item=db.trash[index];if(db[type].some(x=>x.id===itemId)){alert('Zapis s tem ID že obstaja.');return;}db[type].push(item.data);db.trash.splice(index,1);save();render();toast('Zapis je obnovljen.')}

function completeProjectForPaidInvoice(invoice){if(!invoice||invoice.status!=='Plačano')return {project:false,offer:false};const linkedOffer=invoice.sourceOfferId?db.offers.find(o=>o.id===invoice.sourceOfferId):null;let offerChanged=false,projectChanged=false;if(linkedOffer&&linkedOffer.status!=='Potrjeno'){linkedOffer.status='Potrjeno';offerChanged=true}const projectId=invoice.sourceProjectId||linkedOffer?.sourceProjectId;const project=projectId?db.projects.find(p=>p.id===projectId):null;if(project&&project.status!=='Zaključeno'){project.status='Zaključeno';projectChanged=true}return {project:projectChanged,offer:offerChanged}}
function changeDocStatus(type,uid,value){const valid=type==='offers'?['Osnutek','Poslano','Potrjeno','Zavrnjeno']:['Osnutek','Poslano','Plačano','Zamuda'];const doc=db[type]?.find(x=>x.id===uid);if(!doc||!valid.includes(value))return;doc.status=value;const updated=type==='invoices'?completeProjectForPaidInvoice(doc):{project:false,offer:false};save();render();toast(updated.project&&updated.offer?'Račun plačan – projekt zaključen, ponudba potrjena':updated.project?'Račun plačan – povezani projekt je zaključen':updated.offer?'Račun plačan – povezana ponudba je potrjena':'Status posodobljen')}
function docList(type){let arr=[...db[type]].reverse(),name=type==='offers'?'ponudb':'računov';return `${headerBtn('Pregled '+name,`openForm('${type}')`)}${listRows(arr,['Številka','Stranka','Datum','Znesek brez DDV','Z DDV','Status',''],x=>`<tr class="project-row ${type==='offers'&&x.status==='Potrjeno'?'confirmed-offer-row':type==='invoices'&&x.status==='Plačano'?'paid-invoice-row':type==='invoices'&&x.status==='Zamuda'?'overdue-invoice-row':''}" tabindex="0" role="link" onclick="openForm('${type}','${x.id}')" onkeydown="if(event.key==='Enter')openForm('${type}','${x.id}')"><td><b>${esc(x.number)}</b></td><td>${esc(findClient(x.client))}</td><td>${dateFmt(x.date)}</td><td>${fmt(x.amount)}</td><td>${fmt(totalDoc(x))}</td><td><select aria-label="Spremeni status" style="max-width:150px;padding:7px;border:1px solid #cbd5e1;border-radius:7px" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()" onchange="event.stopPropagation();changeDocStatus('${type}','${x.id}',this.value)">${(type==='offers'?['Osnutek','Poslano','Potrjeno','Zavrnjeno']:['Osnutek','Poslano','Plačano','Zamuda']).map(st=>`<option value="${st}" ${x.status===st?'selected':''}>${st}</option>`).join('')}</select></td><td style="text-align:right">${type==='offers'?'<button type="button" class="btn small" onclick="event.stopPropagation();convert(\''+x.id+'\')">Naredi račun</button> ':''}<button type="button" class="textbtn" style="font-size:20px" title="Premakni v koš" aria-label="Premakni v koš" onclick="event.stopPropagation();moveToTrash('${type}','${x.id}')">🗑️</button></td></tr>`)}`}
function reports(){let income=sum(db.invoices.filter(x=>x.status==='Plačano'),x=>x.amount),cost=sum(db.expenses,x=>x.amount),exposure=sum(db.invoices.filter(x=>x.status!=='Plačano'),x=>x.amount),inv=sum(db.stock,x=>x.qty*x.price),max=Math.max(income,cost,1);return `<div class="report"><div class="panel"><h2>Operativni pregled (informativno)</h2><div class="bars"><div class="barrow"><b>Prihodki*</b><div class="bar"><span style="width:${income/max*100}%"></span></div><small>${fmt(income)}</small></div><div class="barrow"><b>Stroški**</b><div class="bar"><span style="width:${cost/max*100}%;background:#d3a45e"></span></div><small>${fmt(cost)}</small></div></div><h2 style="margin-top:25px">Razlika prikazanih zneskov: ${fmt(income-cost)}</h2><p class="help">* Plačani osnutki računov brez DDV. ** Vneseni stroški, brez razločevanja davčne osnove in DDV. Rezultat ni dobiček podjetja ali računovodska bilanca.</p></div><div class="panel"><h2>Drugi kazalniki</h2><p>Neplačani osnutki brez DDV: <b>${fmt(exposure)}</b></p><p>Ocenjena vrednost zaloge: <b>${fmt(inv)}</b></p><p>Število projektov: <b>${db.projects.length}</b></p><p>Število strank: <b>${db.clients.length}</b></p><p class="help">Za uradno bilanco so potrebni dvostavno knjigovodstvo, kontni načrt, obračuni, knjiženje in kontrola.</p></div></div>`}
function settings(){let c=db.company;return `<div class="panel"><h2>Podatki podjetja</h2><form onsubmit="saveSettings(event)" class="formgrid"><label class="field span2">Naziv podjetja<input name="name" value="${esc(c.name)}" required></label><label class="field">Naslov<input name="address" value="${esc(c.address)}"></label><label class="field">Davčna številka / ID za DDV<input name="tax" value="${esc(c.tax)}"></label><label class="field">IBAN<input name="iban" value="${esc(c.iban)}"></label><label class="field">E-pošta<input name="email" value="${esc(c.email)}"></label><label class="field">Telefon<input name="phone" value="${esc(c.phone)}"></label><label class="field">Privzeti DDV (%)<input name="defaultVat" type="number" min="0" max="100" step="0.1" value="${esc(c.defaultVat)}"></label><div class="span2"><button class="btn primary">Shrani podatke</button></div></form></div><div class="panel spaced"><h2>Podatki in varnostne kopije</h2><p class="muted">Podatki niso v oblaku. Če počistiš brskalnik ali zamenjaš napravo, lahko izginejo.</p><div class="actions"><button class="btn primary" onclick="exportData()">↓ Izvozi podatke JSON</button><button class="btn" onclick="document.getElementById('importfile').click()">↑ Uvozi JSON</button><input type="file" id="importfile" accept="application/json,.json" style="display:none" onchange="importData(event)"><button class="btn danger" onclick="resetDemo()">Ponastavi demo</button></div></div>`}

function fieldHTML(f,v){let [k,label,type,req]=f,value=v?.[k]??(type==='date'?today():'');if(type==='client')return `<label class="field">${label}<select name="${k}" required><option value="">Izberi stranko</option>${db.clients.map(c=>`<option value="${c.id}" ${value===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`;if(type==='textarea')return `<label class="field span2">${label}<textarea name="${k}">${esc(value)}</textarea></label>`;if(type.startsWith('select:'))return `<label class="field">${label}<select name="${k}">${type.slice(7).split('|').map(s=>`<option ${value===s?'selected':''}>${esc(s)}</option>`).join('')}</select></label>`;return `<label class="field">${label}<input name="${k}" type="${type==='number'&&['amount','budget','price'].includes(k)?'text':type}" ${type==='number'&&['amount','budget','price'].includes(k)?'data-money="1" inputmode="decimal"':''} value="${esc(type==='number'&&['amount','budget','price'].includes(k)?moneyNumber(value):value)}" ${req?'required':''} ${type==='number'&&!['amount','budget','price'].includes(k)?'step="0.01"':''} ${type==='date'?'onclick="if(this.showPicker)try{this.showPicker()}catch(e){}"':''}></label>`}

const measurementTemplates=["PARADISO","HIMALAJA","IMPALA","LABRADOR","NERO Belfast","NERO Kitajc","NERO Pretoria","OLIVA","POLICE ena debelina","POLICE VEČ DEBELIN","VISCONT WHITE","PRAZEN LIST"];
let draftMeasurements={};let pendingProjectAttachmentId='';
function measurementPicker(){const selected=Object.keys(draftMeasurements);const available=measurementTemplates.filter(n=>!selected.includes(n));return '<section class="measurement-section"><h2>Izmere – Excelove predloge</h2>'+(selected.length?'<div class="sectiontop"><h3>Izbrane predloge: '+selected.map(esc).join(', ')+'</h3><div class="actions"><button type="button" class="btn" onclick="changeMeasurementTemplate()">Zamenjaj predlogo</button>'+(available.length?'<button type="button" class="btn primary" onclick="showAddMeasurementTemplate()">＋ Dodaj predlogo</button>':'')+'</div></div>':'<p class="help">Izberi predlogo za ta projekt.</p><div class="measurement-choices">'+measurementTemplates.map(n=>'<button type="button" class="btn measurement-choice" onclick="selectMeasurementTemplate(decodeURIComponent(\''+encodeURIComponent(n)+'\'))">'+esc(n)+'</button>').join('')+'</div>')+'<div id="add-measurement-template" style="display:none"></div><div id="measurement-editors">'+measurementEditors(draftMeasurements)+'</div></section>'}
function selectMeasurementTemplate(n){if(!measurementTemplates.includes(n))return;if(!(n in draftMeasurements)&&Object.keys(draftMeasurements).length)draftMeasurements={[n]:{rows:[]},...draftMeasurements};else draftMeasurements[n]=draftMeasurements[n]||{rows:[]};refreshMeasurementPicker();if(page==='project-measurements')saveProjectMeasurements(false)}
function showAddMeasurementTemplate(){const available=measurementTemplates.filter(n=>!(n in draftMeasurements));const el=document.getElementById('add-measurement-template');if(!el)return;el.style.display='block';el.innerHTML='<div class="panel" style="padding:14px;margin:12px 0"><h3>Izberi dodatno predlogo</h3><div class="measurement-choices">'+available.map(n=>'<button type="button" class="btn measurement-choice" onclick="selectMeasurementTemplate(decodeURIComponent(\''+encodeURIComponent(n)+'\'))">'+esc(n)+'</button>').join('')+'</div><button type="button" class="btn" onclick="this.parentElement.parentElement.style.display=\'none\'">Prekliči</button></div>';}
function changeMeasurementTemplate(){if(!confirm('Zamenjava predlog odstrani vse trenutne izmere iz tega projekta. Nadaljujem?'))return;draftMeasurements={};refreshMeasurementPicker();if(page==='project-measurements')saveProjectMeasurements(false)}
function refreshMeasurementPicker(){const el=document.querySelector('.measurement-section');if(el)el.outerHTML=measurementPicker()}
function toggleMeasurementTemplate(el,n){selectMeasurementTemplate(n)}
function measurementArea(r){return ((Number(String(r.length||0).replace(',','.'))||0)*(Number(String(r.width||0).replace(',','.'))||0)*(Number(String(r.qty||0).replace(',','.'))||0))/10000}
function measurementEditors(templates){return Object.entries(templates||{}).map(([n,t])=>'<section class="measurement-editor"><h3>'+esc(n)+'</h3><p class="help">Mere vpisuj v centimetrih (cm), površina se izračuna v m².</p><div class="tablewrap"><table><thead><tr><th>Element</th><th>Dolžina (cm)</th><th>Širina (cm)</th><th>Kosov</th><th>Skupaj (m²)</th><th></th></tr></thead><tbody>'+((t.rows||[]).map((r,i)=>measurementRow(n,r,i)).join(''))+'</tbody></table></div><div style="padding:10px;background:#f4f6f8;margin:8px 0 12px">Skupaj kvadratnih metrov: <b class="measurement-total">'+(t.rows||[]).reduce((sum,r)=>sum+measurementArea(r),0).toFixed(3)+'</b> m²</div><button type="button" class="btn" onclick="addMeasurementRow(decodeURIComponent(\''+encodeURIComponent(n)+'\'))">+ Dodaj vrstico</button></section>').join('')}
function measurementRow(n,r,i){return '<tr><td><input aria-label="Element" value="'+esc(r.name||'')+'" onchange="changeMeasurement(decodeURIComponent(\''+encodeURIComponent(n)+'\'),'+i+',\'name\',this.value)"></td>'+['length','width','qty'].map(k=>'<td><div style="display:flex;align-items:center;gap:4px"><input style="width:82px;min-width:0" type="text" inputmode="decimal" aria-label="'+(k==='length'?'Dolžina':k==='width'?'Širina':'Kosov')+'" value="'+esc(r[k]??'')+'" oninput="changeMeasurement(decodeURIComponent(\''+encodeURIComponent(n)+'\'),'+i+',\''+k+'\',this.value)">'+(k==='qty'?'':'<span>cm</span>')+'</div></td>').join('')+'<td>'+measurementArea(r).toFixed(3)+'</td><td><button type="button" class="textbtn" onclick="removeMeasurementRow(decodeURIComponent(\''+encodeURIComponent(n)+'\'),'+i+')">Odstrani</button></td></tr>'}
function addMeasurementRow(n){draftMeasurements[n].rows.push({name:'',length:'',width:'',qty:1});document.getElementById('measurement-editors').innerHTML=measurementEditors(draftMeasurements);if(page==='project-measurements')saveProjectMeasurements(false)}
function removeMeasurementRow(n,i){draftMeasurements[n].rows.splice(i,1);document.getElementById('measurement-editors').innerHTML=measurementEditors(draftMeasurements);if(page==='project-measurements')saveProjectMeasurements(false)}
function changeMeasurement(n,i,k,v){draftMeasurements[n].rows[i][k]=v;const table=document.getElementById('measurement-editors');const tr=table?.querySelectorAll('.measurement-editor')[Object.keys(draftMeasurements).indexOf(n)]?.querySelectorAll('tbody tr')[i];if(tr){const r=draftMeasurements[n].rows[i];tr.children[4].textContent=measurementArea(r).toFixed(3);const total=tr.closest('.measurement-editor')?.querySelector('.measurement-total');if(total)total.textContent=(draftMeasurements[n].rows||[]).reduce((sum,row)=>sum+measurementArea(row),0).toFixed(3)}if(page==='project-measurements')saveProjectMeasurements(false)}

function renderBlankSheet(t){return '<section class="measurement-editor"><h3>Opis dela / prazen list</h3><label class="field">Opis storitve<textarea rows="7" style="width:100%;min-height:170px" placeholder="Npr. montaža stopnic, demontaža starega spomenika …" oninput="blankSheetChange(\'description\',this.value)">'+esc(t.description||'')+'</textarea></label><div class="formgrid"><label class="field">Cena brez DDV (€)<input type="text" inputmode="decimal" value="'+esc(t.price??'')+'" oninput="blankSheetChange(\'price\',this.value)"></label><label class="field">DDV<select onchange="blankSheetChange(\'vatRate\',this.value)"><option value="22" '+(String(t.vatRate||22)==='22'?'selected':'')+'>22 %</option><option value="9.5" '+(String(t.vatRate)==='9.5'?'selected':'')+'>9,5 %</option></select></label></div></section>';}
function blankSheetChange(k,v){const t=draftMeasurements['PRAZEN LIST'];if(!t)return;t[k]=v;if(page==='project-measurements')saveProjectMeasurements(false);}

// Priloge so v IndexedDB, ne v localStorage (ki je premajhen za fotografije).
function attachmentsDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('zagorc_project_attachments',1);r.onupgradeneeded=()=>{const store=r.result.createObjectStore('files',{keyPath:'id'});store.createIndex('projectId','projectId');};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function attachmentList(projectId){const dbx=await attachmentsDb();return new Promise((resolve,reject)=>{const tx=dbx.transaction('files','readonly');const req=tx.objectStore('files').index('projectId').getAll(projectId);req.onsuccess=()=>{resolve(req.result);dbx.close();};req.onerror=()=>{reject(req.error);dbx.close();};});}
async function transferProjectAttachments(fromId,toId){try{const files=await attachmentList(fromId);if(!files.length)return;const dbx=await attachmentsDb();await new Promise((resolve,reject)=>{const tx=dbx.transaction('files','readwrite');const store=tx.objectStore('files');files.forEach(f=>{store.put({...f,projectId:toId});});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});dbx.close();refreshProjectAttachments();}catch(e){alert('Fotografij ni bilo mogoče prenesti v projekt. Ostale so shranjene v tem brskalniku.');}}
function attachmentPanel(projectId){return '<section class="panel" style="margin-top:18px"><h2>📷 Fotografije in datoteke projekta</h2><p class="help">Izberi eno ali več fotografij ali datotek. Na telefonu lahko uporabiš tudi kamero. Priloge so shranjene v tem brskalniku.</p><div style="display:grid;gap:12px"><label style="display:block;font-weight:600">Dodaj slike ali datoteke<input aria-label="Dodaj slike ali datoteke" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt" style="display:block;width:100%;margin-top:7px;padding:10px;border:1px solid #b5c3cf;border-radius:8px;background:white" onchange="uploadProjectAttachments(\''+projectId+'\',this.files);this.value=\'\'"></label><label style="display:block;font-weight:600">📷 Fotografiraj s telefonom<input aria-label="Fotografiraj" type="file" accept="image/*" capture="environment" style="display:block;width:100%;margin-top:7px;padding:10px;border:1px solid #b5c3cf;border-radius:8px;background:white" onchange="uploadProjectAttachments(\''+projectId+'\',this.files);this.value=\'\'"></label></div><div class="project-attachment-list" data-project="'+projectId+'" style="margin-top:16px">Nalagam fotografije …</div></section>';}
async function uploadProjectAttachments(projectId,files){const selectedFiles=Array.from(files||[]);if(!selectedFiles.length)return;try{const dbx=await attachmentsDb();for(const file of selectedFiles){await new Promise((resolve,reject)=>{const tx=dbx.transaction('files','readwrite');tx.objectStore('files').put({id:id(),projectId,name:file.name,type:file.type,blob:file,created:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}dbx.close();await refreshProjectAttachments();toast('Priloge shranjene');}catch(err){alert('Prilog ni bilo mogoče shraniti: '+err.message);}}

let projectAttachmentUrls=[];
function clearProjectAttachmentUrls(){projectAttachmentUrls.forEach(url=>URL.revokeObjectURL(url));projectAttachmentUrls=[];}
async function getProjectAttachment(fileId){const dbx=await attachmentsDb();try{return await new Promise((resolve,reject)=>{const r=dbx.transaction('files').objectStore('files').get(fileId);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}finally{dbx.close();}}
async function refreshProjectAttachments(target){const box=target||document.querySelector('.project-attachment-list');if(!box)return;const projectId=box.dataset.project;try{const files=await attachmentList(projectId);if(!box.isConnected||box.dataset.project!==projectId)return;clearProjectAttachmentUrls();box.innerHTML=files.length?'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:16px">'+files.sort((a,b)=>(a.created||0)-(b.created||0)).map(f=>{const photo=(f.type||'').startsWith('image/');const url=photo?URL.createObjectURL(f.blob):'';if(url)projectAttachmentUrls.push(url);return '<div style="border:1px solid #d4dce4;border-radius:10px;padding:10px;min-width:0">'+(photo?'<button type="button" style="display:block;width:100%;padding:0;border:0;background:transparent;cursor:zoom-in" onclick="openProjectAttachment(\''+f.id+'\')"><img src="'+url+'" alt="'+esc(f.name)+'" style="width:100%;height:135px;object-fit:cover;border-radius:7px"></button>':'<button type="button" class="btn" onclick="openProjectAttachment(\''+f.id+'\')" style="width:100%;height:135px">📄 Odpri datoteko</button>')+'<div style="font-size:12px;word-break:break-word;margin:8px 0">'+esc(f.name)+'</div><div class="actions"><button type="button" class="btn" onclick="openProjectAttachment(\''+f.id+'\')">🔍 Odpri</button> '+(photo?'<button type="button" class="btn" onclick="printProjectAttachment(\''+f.id+'\')">🖨 Natisni</button> ':'')+'<button type="button" class="textbtn" onclick="removeProjectAttachment(\''+f.id+'\')" title="Izbriši prilogo">🗑️</button></div></div>';}).join('')+'</div>':'<p class="help">Ni dodanih prilog.</p>';}catch(e){box.textContent='Prilog ni mogoče naložiti v tem brskalniku.';}}
function closeProjectPhoto(){const overlay=document.getElementById('project-photo-viewer');if(overlay){URL.revokeObjectURL(overlay.dataset.url);overlay.remove();document.removeEventListener('keydown',projectPhotoEscape);}}
function projectPhotoEscape(e){if(e.key==='Escape')closeProjectPhoto();}
async function openProjectAttachment(fileId){const f=await getProjectAttachment(fileId);if(!f)return;if((f.type||'').startsWith('image/')){closeProjectPhoto();const url=URL.createObjectURL(f.blob);const overlay=document.createElement('div');overlay.id='project-photo-viewer';overlay.dataset.url=url;overlay.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;box-sizing:border-box';overlay.innerHTML='<div style="width:100%;display:flex;justify-content:space-between;gap:8px;align-items:center;color:white;padding:6px 0"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(f.name)+'</span><div style="display:flex;gap:8px"><button class="btn" type="button" onclick="printProjectAttachment(\''+fileId+'\')">🖨 Natisni</button><button class="btn" type="button" onclick="closeProjectPhoto()">✕ Zapri</button></div></div><img alt="'+esc(f.name)+'" src="'+url+'" style="max-width:100%;max-height:calc(100vh - 85px);object-fit:contain">';overlay.addEventListener('click',e=>{if(e.target===overlay)closeProjectPhoto();});document.body.appendChild(overlay);document.addEventListener('keydown',projectPhotoEscape);return;}const url=URL.createObjectURL(f.blob);const a=document.createElement('a');a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
async function printProjectAttachment(fileId){const w=window.open('','_blank');if(!w){alert('Dovoli pojavna okna za tiskanje fotografij.');return;}try{const f=await getProjectAttachment(fileId);if(!f||!(f.type||'').startsWith('image/')){w.close();return;}const url=URL.createObjectURL(f.blob);w.document.open();w.document.write('<!doctype html><html lang="sl"><head><meta charset="utf-8"><title>'+esc(f.name)+'</title><style>@page{size:auto;margin:10mm}body{margin:0;display:flex;align-items:center;justify-content:center;min-height:95vh}img{max-width:100%;max-height:95vh;object-fit:contain}</style></head><body><img id="photo" alt="Fotografija za tiskanje"></body></html>');w.document.close();const img=w.document.getElementById('photo');img.onload=()=>{w.focus();w.print();setTimeout(()=>URL.revokeObjectURL(url),60000);};img.src=url;}catch(e){w.close();alert('Fotografije ni mogoče natisniti.');}}
async function removeProjectAttachment(fileId){if(!confirm('Izbrišem prilogo?'))return;const dbx=await attachmentsDb();await new Promise((resolve,reject)=>{const tx=dbx.transaction('files','readwrite');tx.objectStore('files').delete(fileId);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});dbx.close();refreshProjectAttachments();}

function printProjectMeasurements(useDraft){const p=db.projects.find(x=>x.id===selectedProjectId);if(!p)return;const c=db.clients.find(x=>x.id===p.client)||{};if(useDraft)saveProjectMeasurements(false);const data=useDraft?draftMeasurements:(p.measurements||{});if(!Object.keys(data).length){alert('Najprej izberi predlogo in vnesi mere.');return;}const holder=document.createElement('div');holder.innerHTML=measurementEditors(data);holder.querySelectorAll('tbody tr').forEach(tr=>{const inputs=[...tr.querySelectorAll('input')];if(!inputs.length||inputs.some(input=>!String(input.value||'').trim()||Number(String(input.value).replace(',','.'))===0)){tr.remove();}});holder.querySelectorAll('table').forEach(table=>{if(!table.querySelector('tbody tr')){const wrap=table.closest('.tablewrap');if(wrap){const heading=wrap.previousElementSibling;if(heading&&/^H[34]$/.test(heading.tagName))heading.remove();wrap.remove();}}});holder.querySelectorAll('.measurement-editor').forEach(section=>{[...section.children].forEach(child=>{if(child.tagName==='DIV'&&!child.classList.contains('tablewrap'))child.remove();});});const primary=Object.keys(data).slice(-1)[0];holder.querySelectorAll('.measurement-editor').forEach((section,index)=>{const template=Object.keys(data)[index];const t=data[template];const material=projectMaterialPrice(template,t);const isPrimary=template===primary;section.insertAdjacentHTML('beforeend','<div class="print-summary" style="margin-top:15px;padding:10px;border-top:1px solid #9ba7b4"><b>'+esc(template)+'</b><div>Material: <b>'+moneyNumber(material)+' €</b></div>'+(isPrimary&&Object.keys(data).length>1?'<div>Material vseh predlog skupaj: <b>'+moneyNumber(material+Object.entries(data).reduce((sum,[name,value])=>sum+(name===primary?0:projectMaterialPrice(name,value)),0))+' €</b></div>':'')+'</div>');});holder.querySelectorAll('input,select,textarea').forEach(el=>{const span=document.createElement('span');span.textContent=el.tagName==='SELECT'?el.options[el.selectedIndex]?.textContent||'':el.value;el.replaceWith(span)});holder.querySelectorAll('button,.help').forEach(el=>el.remove());const name=esc(c.name||p.clientName||'—'),place=esc(p.objectLocation||'—');const pageHeader='<header><h1>IZMERE – '+name+'</h1><div><b>Stranka:</b> '+name+'</div><div><b>Kraj objekta:</b> '+place+'</div></header>';const printPages=[...holder.querySelectorAll('.measurement-editor')].map(section=>'<div class="print-page">'+pageHeader+section.outerHTML+'</div>').join('');const html='<!doctype html><html lang="sl"><head><meta charset="utf-8"><title>Izmere - '+name+'</title><style>@page{size:A4;margin:13mm}body{font:12px Arial,sans-serif;color:#1d2935}header{border-bottom:2px solid #263e51;margin-bottom:16px;padding-bottom:12px}h1{font-size:21px;margin:0 0 8px}h2{font-size:16px}h3{font-size:15px;margin:15px 0 8px}h4{font-size:13px;margin:12px 0 6px}table{width:100%;border-collapse:collapse;margin:8px 0 12px}th,td{border:1px solid #cbd3d9;padding:5px 7px;text-align:left}th{background:#edf1f4}.print-page{break-before:page;page-break-before:always}.print-page:first-child{break-before:auto;page-break-before:auto}.measurement-editor{margin-bottom:20px;break-before:auto;page-break-before:auto}.tablewrap{overflow:visible}.impala-measures table{width:100%!important}.measurement-editor>div{break-inside:avoid}section{break-inside:auto}tr{break-inside:avoid}button{display:none}span{font-weight:normal}b,strong{font-weight:700}</style></head><body>'+printPages+'<script>window.onload=function(){window.print()}<\/script></body></html>';const w=window.open('','_blank');if(!w){alert('Brskalnik je blokiral okno za tiskanje. Dovoli pojavna okna.');return;}w.document.open();w.document.write(html);w.document.close();}

function projectDetail(){const p=db.projects.find(x=>x.id===selectedProjectId);if(!p)return '<div class="panel">Projekt ni najden.</div>';const c=db.clients.find(x=>x.id===p.client);const cell=(label,value,wide=false)=>'<div class="'+(wide?'wide':'')+'"><small>'+label+'</small><b>'+esc(value??'—')+'</b></div>';return '<div class="panel"><div class="sectiontop"><button class="btn" onclick="go(&quot;projects&quot;)">← Nazaj na projekte</button><button class="btn primary" onclick="openForm(&quot;projects&quot;,selectedProjectId)">Uredi projekt</button>'+(p.status==='Zaključeno'?'<button class="btn" onclick="setProjectCompleted(selectedProjectId,false)">↩ Ponovno odpri projekt</button>':'<button class="btn" onclick="setProjectCompleted(selectedProjectId,true)">✓ Zaključi projekt</button>')+'<button class="btn" onclick="createOfferFromProject(selectedProjectId)">＋ Naredi ponudbo</button></div><h2>'+esc(p.name)+'</h2><div class="project-detail">'+cell('Stranka',c?.name)+cell('Telefon',c?.phone||'—')+cell('E-pošta',c?.email||'—')+cell('Naslov',c?.address||'—')+cell('Kraj objekta',p.objectLocation||'—')+cell('Predviden rok',dateFmt(p.deadline))+cell('Vrednost brez DDV',projectPriceLabel(p,false))+cell('Vrednost z DDV',projectPriceLabel(p,true))+'<div><small>Status</small><select aria-label="Status projekta" onchange="changeProjectStatus(selectedProjectId,this.value)" style="display:block;width:100%;max-width:220px;margin-top:5px;padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:white;font-weight:600">'+['?','V izdelavi','Zaključeno'].map(x=>'<option value="'+esc(x)+'"'+(p.status===x?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div>'+cell('Opombe',p.notes||'—',true)+'</div></div>'+'<div class="panel"><div class="sectiontop"><h2>Izmere projekta</h2><div class="actions"><button class="btn" onclick="printProjectMeasurements(false)">🖨 Natisni izmere</button><button class="btn primary" onclick="editProjectMeasurements()">Uredi izmere</button></div></div>'+projectMeasurementsPreview(p.measurements)+'</div>'+attachmentPanel(p.id)}
function projectMeasurementsPreview(measurements){if(!measurements||!Object.keys(measurements).length)return '<p class="help">Izmere še niso vnesene. Klikni Uredi izmere za dodajanje.</p>';const container=document.createElement('div');container.innerHTML=measurementEditors(measurements);container.querySelectorAll('tbody tr').forEach(tr=>{const inputs=[...tr.querySelectorAll('input')];if(inputs.length&&inputs.every(el=>!String(el.value||'').trim()))tr.remove();});container.querySelectorAll('input,select,textarea').forEach(el=>{const span=document.createElement('span');span.textContent=el.tagName==='SELECT'?(el.options[el.selectedIndex]?.textContent||''):el.value;el.replaceWith(span);});container.querySelectorAll('button').forEach(el=>el.remove());container.querySelectorAll('.help').forEach(el=>el.remove());container.querySelectorAll('table').forEach(table=>{if(!table.querySelector('tbody tr')){const wrap=table.closest('.tablewrap');if(wrap){const title=wrap.previousElementSibling;if(title&&/^H[34]$/.test(title.tagName))title.remove();wrap.remove();}}});return container.innerHTML;}

function openForm(type,edit=''){if(type==='offers'||type==='invoices'){openDoc(type,edit);return}if(type==='expenses'){openExpensePage(edit);return}let o=db[type].find(x=>x.id===edit)||{};if(type==='projects'){let c=db.clients.find(c=>c.id===o.client);o={...o,clientName:c?.name||'',clientPhone:c?.phone||'',clientEmail:c?.email||'',clientAddress:c?.address||'',clientTax:c?.tax||''}}let title={clients:'stranko',projects:'projekt',expenses:'strošek',stock:'material'}[type];showModal(`<h2>${edit?'Uredi':'Dodaj'} ${title}</h2><form id="editor" onsubmit="submitSimple(event,'${type}','${edit}')"><div class="formgrid">${fields[type].map(f=>fieldHTML(f,o)).join('')}</div>${type==='projects'&&edit?attachmentPanel(edit):''}<footer><button type="button" class="btn" onclick="closeModal()">Prekliči</button><button class="btn primary" type="submit">Shrani</button></footer></form>`) }

function saveExpense(e,edit){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.amount=moneyParse(o.amount);if(edit){const item=db.expenses.find(x=>x.id===edit);if(item)Object.assign(item,o)}else db.expenses.push({id:id(),...o});save();go('expenses');toast('Strošek shranjen')}
function nextOfferNumber(){const year=String(new Date().getFullYear()).slice(-2);let max=0;for(const offer of db.offers){const match=String(offer.number||'').match(/^([0-9]+)-([0-9]{2})$/);if(match&&match[2]===year)max=Math.max(max,Number(match[1]));}return String(max+1).padStart(3,'0')+'-'+year;}
function syncProjectOffer(project){if(!project||!Object.keys(project.measurements||{}).length)return;const templates=project.measurements;const net=typeof window.zagorcMeasurementPrice==='function'?window.zagorcMeasurementPrice(templates,false):moneyParse(projectPriceLabel(project,false));const names=Object.keys(templates),primary=templates[names[names.length-1]]||{};const vat=String(primary.impalaCells?.vatRate||primary.vatRate)==='9.5'?9.5:22;if(!Number.isFinite(net))return;let offer=db.offers.find(o=>o.sourceProjectId===project.id);if(!offer){offer={id:id(),number:nextOfferNumber(),sourceProjectId:project.id,status:'Osnutek',date:today(),due:project.deadline||today()};db.offers.push(offer);}offer.client=project.client;offer.desc=project.name+(project.objectLocation?' – '+project.objectLocation:'');const first={desc:project.name,unit:'kpl',qty:1,price:Math.round(net*100)/100};offer.items=[first,...(offer.items||[]).slice(1)];offer.amount=sum(offer.items,x=>(Number(x.qty)||0)*(Number(x.price)||0));offer.vat=vat;}
function nextInvoiceNumber(){const year=String(new Date().getFullYear()).slice(-2);let max=0;for(const invoice of db.invoices){const match=String(invoice.number||'').match(/^([0-9]+)-([0-9]{2})$/);if(match&&match[2]===year)max=Math.max(max,Number(match[1]));}return String(max+1).padStart(3,'0')+'-'+year;}
function submitSimple(e,type,edit){e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));['amount','budget','qty','minimum','price'].forEach(k=>{if(k in obj)obj[k]=moneyParse(obj[k])});if(type==='projects'&&page==='project-new')obj.measurements=JSON.parse(JSON.stringify(draftMeasurements));if(type==='projects'){const name=(obj.clientName||'').trim();if(!name){alert('Vpiši ime ali naziv stranke.');return}const phone=(obj.clientPhone||'').trim(),email=(obj.clientEmail||'').trim(),address=(obj.clientAddress||'').trim(),tax=(obj.clientTax||'').trim();const existingProject=edit?db.projects.find(p=>p.id===edit):null;let client=existingProject?db.clients.find(c=>c.id===existingProject.client):null;const normalized=x=>(x||'').trim().toLocaleLowerCase('sl');if(!client||normalized(client.name)!==normalized(name)){client=db.clients.find(c=>normalized(c.name)===normalized(name)&&(phone?normalized(c.phone)===normalized(phone):true))}if(!client){client={id:id(),name,phone,email,address,tax};db.clients.push(client)}else{for(const [k,v] of Object.entries({phone,email,address,tax})){if(v&&!client[k])client[k]=v}}obj.client=client.id;for(const k of ['clientName','clientPhone','clientEmail','clientAddress','clientTax'])delete obj[k]}if(edit){Object.assign(db[type].find(x=>x.id===edit),obj)}else {const newId=id();db[type].push({id:newId,...obj});if(type==='projects'&&page==='project-new'){selectedProjectId=newId;page='project-detail';if(pendingProjectAttachmentId){transferProjectAttachments(pendingProjectAttachmentId,newId);pendingProjectAttachmentId='';}}}if(type==='projects'){const project=db.projects.find(p=>p.id===(edit||selectedProjectId));if(project)syncProjectOffer(project)}save();closeModal();render();toast('Vnos shranjen')}
function showModal(html){closeModal();const w=document.createElement('div');w.id='overlay';w.className='modalwrap';w.innerHTML=`<div class="modal">${html}</div>`;w.addEventListener('click',e=>{if(e.target===w)closeModal()});document.body.appendChild(w);if(w.querySelector('.project-attachment-list'))refreshProjectAttachments(w.querySelector('.project-attachment-list'))}function closeModal(){document.getElementById('overlay')?.remove()}
let offerPageHTML='';
function offerArrowNavigation(event){if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;const form=document.getElementById('docForm');if(!form||!form.contains(event.target))return;const fields=[...form.querySelectorAll('input:not([type="hidden"]),select,textarea')].filter(el=>!el.disabled&&el.getClientRects().length&&el.getBoundingClientRect().width>0);const current=event.target;if(!fields.includes(current))return;const a=current.getBoundingClientRect(),ax=(a.left+a.right)/2,ay=(a.top+a.bottom)/2;const horizontal=event.key==='ArrowLeft'||event.key==='ArrowRight',positive=event.key==='ArrowRight'||event.key==='ArrowDown';let best=null,bestScore=Infinity;for(const el of fields){if(el===current)continue;const b=el.getBoundingClientRect(),bx=(b.left+b.right)/2,by=(b.top+b.bottom)/2,primary=horizontal?bx-ax:by-ay,secondary=horizontal?Math.abs(by-ay):Math.abs(bx-ax);if(positive?primary<=2:primary>=-2)continue;const score=Math.abs(primary)+secondary*3;if(score<bestScore){best=el;bestScore=score;}}if(best){event.preventDefault();best.focus();if(best.tagName==='INPUT'&&best.type!=='date'&&best.type!=='number'&&typeof best.select==='function')best.select();}}

function offerValidUntil(date){const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(date||'');if(!match)return '';const year=Number(match[1]),month=Number(match[2]),day=Number(match[3]);const target=new Date(year,month,1);const last=new Date(target.getFullYear(),target.getMonth()+1,0).getDate();return target.getFullYear()+'-'+String(target.getMonth()+1).padStart(2,'0')+'-'+String(Math.min(day,last)).padStart(2,'0')}
function openOfferTemplate(edit='',type='offers'){const invoice=type==='invoices';const o=db[type].find(x=>x.id===edit)||{};const project=db.projects.find(p=>p.id===o.sourceProjectId);const c=db.clients.find(x=>x.id===(o.client||project?.client))||{};docType=type;docItems=clone(o.items||[{desc:project?.name||'',unit:'kpl',qty:1,price:0}]);if(project&&!invoice&&!o.sourceOfferId){const net=typeof window.zagorcMeasurementPrice==='function'?window.zagorcMeasurementPrice(project.measurements||{},false):moneyParse(projectPriceLabel(project,false));const first={desc:project.name,unit:'kpl',qty:1,price:Math.round(net*100)/100};if(!docItems.length)docItems=[first];else docItems[0]=first;}const number=o.number||(invoice?nextInvoiceNumber():nextOfferNumber()),co=db.company;showOfferPage('<div style="margin-bottom:14px"><button type="button" class="btn" onclick="go(\''+type+'\')">← Nazaj na '+(invoice?'račune':'ponudbe')+'</button></div><div class="sectiontop"><h2>'+(invoice?'Račun ':'Ponudba ')+esc(number)+'</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary" onclick="printCurrentOffer()">🖨 Natisni '+(invoice?'račun':'ponudbo')+' / PDF</button>'+(!invoice&&edit?'<button type="button" class="btn primary" onclick="convert(&#39;'+edit+'&#39;)">＋ Naredi račun</button>':'')+'</div></div><p class="help">Urejanje po vzorcu Excelove ponudbe. Postavke in seštevki se izračunavajo samodejno.</p><form id="docForm" onsubmit="submitDoc(event,\''+type+'\',\''+edit+'\')"><div class="panel" style="padding:16px;background:white"><div style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap"><div><b style="font-size:20px">KAMNOSEŠTVO Zagorc</b><div>'+esc(co.name||'ZAGI TEAM d.o.o.')+'</div><div>'+esc(co.address||'Cesta komandanta Staneta 7, 1270 Litija')+'</div><div>ID za DDV: '+esc(co.tax||'')+'</div><div>TRR: '+esc(co.iban||'')+'</div><div>Tel.: '+esc(co.phone||'')+'</div></div><div style="min-width:220px"><h2 style="margin:0">'+(invoice?'RAČUN ŠT.':'PONUDBA ŠT.')+'</h2><label class="field">Številka<input name="number" required value="'+esc(number)+'"></label><label class="field" onclick="if(event.target!==this.firstElementChild)this.firstElementChild.showPicker()">Datum<input name="date" type="date" required onclick="this.showPicker()" value="'+esc(o.date||today())+'"></label><label class="field">Kraj<input name="issuePlace" value="'+esc(o.issuePlace||'Litija')+'"></label><label class="field" onclick="if(event.target===this)this.querySelector(&quot;input&quot;).showPicker()">Opravljeno / rok<input name="completion" type="date" onclick="if(this.showPicker)try{this.showPicker()}catch(e){}" value="'+esc(/^\d{4}-\d{2}-\d{2}$/.test(o.completion||'')?o.completion:'')+'"></label>'+(invoice?'<label class="field" onclick="if(event.target===this)this.querySelector(&quot;input&quot;).showPicker()">Rok plačila<input name="dueDate" type="date" onclick="if(this.showPicker)try{this.showPicker()}catch(e){}" value="'+esc(o.dueDate||o.dueDateLegacy||'')+'"></label>':'<label class="field">Veljavnost<input name="paymentTerms" type="date" onclick="if(this.showPicker)try{this.showPicker()}catch(e){}" value="'+esc(/^\d{4}-\d{2}-\d{2}$/.test(o.paymentTerms||'')?o.paymentTerms:offerValidUntil(o.date||today()))+'"></label>')+'</div></div><h3>Naslovnik</h3><label class="field">Stranka<select name="client" required onchange="offerClientChanged(this.value)"><option value="">Izberi stranko</option>'+db.clients.map(x=>'<option value="'+esc(x.id)+'"'+((o.client||project?.client)===x.id?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label><p class="help">Podatki so preneseni iz imenika. Spremembe tukaj veljajo samo za to ponudbo.</p><div class="formgrid"><label class="field">Ime / naziv stranke<input name="offerClientName" value="'+esc(o.offerClientName??c.name??'')+'"></label><label class="field">Naslov stranke<input name="offerClientAddress" value="'+esc(o.offerClientAddress??c.address??'')+'"></label><label class="field">Telefon<input name="offerClientPhone" value="'+esc(o.offerClientPhone??c.phone??'')+'"></label><label class="field">E-pošta<input name="offerClientEmail" type="email" value="'+esc(o.offerClientEmail??c.email??'')+'"></label><label class="field">Davčna številka<input name="offerClientTax" value="'+esc(o.offerClientTax??c.tax??'')+'"></label></div><input type="hidden" name="sourceProjectId" value="'+esc(o.sourceProjectId||'')+'"><label class="field">Status<select name="status">'+['Osnutek','Poslano','Potrjeno','Zavrnjeno'].map(v=>'<option'+(o.status===v?' selected':'')+'>'+v+'</option>').join('')+'</select></label><h3>Vrsta blaga oz. storitev</h3><div style="overflow-x:auto"><div style="min-width:680px"><div class="invoicerows linehead" style="grid-template-columns:2.5fr .7fr .8fr 1fr 1fr 1fr"><span>Opis</span><span>Enota</span><span>Količina</span><span>Cena</span><span>Vrednost</span><span></span></div><div id="itemrows"></div></div></div><button type="button" class="btn small" onclick="addItem()">＋ Dodaj postavko</button><div style="margin:20px 0 0 auto;max-width:350px"><div style="display:flex;justify-content:space-between;padding:6px"><b>SKUPAJ</b><b id="docTotal"></b></div>'+(invoice?'<label class="field">Vrsta računa<select name="taxMode" onchange="refreshOfferTotals()"><option value="normal" '+(o.taxMode!=='reverse'?'selected':'')+'>Običajni račun z DDV</option><option value="reverse" '+(o.taxMode==='reverse'?'selected':'')+'>Podjetje – obrnjena davčna obveznost (76.a člen)</option></select></label><p class="help">76.a člen uporabi le za ustrezne dobave med slovenskima zavezancema za DDV. Preveri ID za DDV naročnika in vrsto storitve.</p>':'')+'<label class="field">DDV (%)<select name="vat" onchange="refreshOfferTotals()"><option value="22" '+(Number(o.vat??co.defaultVat??22)===22?'selected':'')+'>22 %</option><option value="9.5" '+(Number(o.vat??co.defaultVat??22)===9.5?'selected':'')+'>9,5 %</option></select></label><div style="display:flex;justify-content:space-between;padding:6px"><span id="offerVatLabel">DDV</span><b id="offerVatAmount"></b></div><div style="display:flex;justify-content:space-between;padding:10px;border-top:2px solid #222"><b>ZA PLAČILO EUR</b><b id="offerGross"></b></div></div><p>Pri plačilu v sklic napišite: SI 00 <b id="offerReference">'+esc(number)+'</b></p><footer><button type="button" class="btn" onclick="go(&quot;offers&quot;)">Prekliči</button><button type="submit" class="btn primary">Shrani '+(invoice?'račun':'ponudbo')+'</button></footer></div></form>');renderItems();const numberInput=document.querySelector('#docForm [name="number"]');if(numberInput)numberInput.addEventListener('input',()=>document.getElementById('offerReference').textContent=numberInput.value);if(!invoice){const issue=document.querySelector('#docForm [name="date"]'),validity=document.querySelector('#docForm [name="paymentTerms"]');if(issue&&validity)issue.addEventListener('change',()=>{validity.value=offerValidUntil(issue.value)})}}
function printCurrentOffer(){const form=document.getElementById('docForm');if(!form)return;const values=Object.fromEntries(new FormData(form));const offer={...values,items:clone(docItems),vat:Number(values.vat)||0,amount:sum(docItems,x=>x.qty*x.price)};if(!offer.client)return toast('Najprej izberi stranko');printDoc(docType,null,offer);}
function offerClientChanged(clientId){const client=db.clients.find(x=>x.id===clientId)||{},form=document.getElementById('docForm');if(!form)return;[['offerClientName','name'],['offerClientAddress','address'],['offerClientPhone','phone'],['offerClientEmail','email'],['offerClientTax','tax']].forEach(([field,key])=>{if(form.elements[field])form.elements[field].value=client[key]||'';});}
function refreshOfferTotals(){const form=document.getElementById('docForm');if(!form||!['offers','invoices'].includes(docType))return;const net=sum(docItems,x=>x.qty*x.price),vat=Number(form.elements.vat?.value)||0;const a=document.getElementById('docTotal'),b=document.getElementById('offerVatAmount'),c=document.getElementById('offerGross');if(a)a.textContent=fmt(net);if(b)b.textContent=fmt(net*vat/100);const label=document.getElementById('offerVatLabel');if(label)label.textContent=form.elements.taxMode?.value==='reverse'?'DDV (obračuna prejemnik, ni za plačilo)':'DDV';if(c)c.textContent=fmt(net*(form.elements.taxMode?.value==='reverse'?1:1+vat/100));}
function openDoc(type,edit=''){if(type==='offers'||type==='invoices'){openOfferTemplate(edit,type);return;}let o=db[type].find(x=>x.id===edit)||{},n=type==='offers'?'Ponudba':'Osnutek računa',prefix=type==='offers'?'P':'R';docType=type;docItems=clone(o.items||[{desc:'Izdelava in montaža',qty:1,price:0}]);let no=o.number||(type==='offers'?nextOfferNumber():nextInvoiceNumber());showModal(`<h2>${edit?'Uredi':'Nova'} ${n.toLowerCase()}</h2><p class="help">Dokument pripraviš za pregled in PDF. Za pravno veljavno izdajo računa je potreben dodatni sistem.</p><form id="docForm" onsubmit="submitDoc(event,'${type}','${edit}')"><div class="formgrid"><label class="field">Oznaka dokumenta<input name="number" required value="${esc(no)}"></label><label class="field">Stranka<select name="client" required><option value="">Izberi stranko</option>${db.clients.map(c=>`<option value="${c.id}" ${o.client===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="field">Datum<input type="date" name="date" required value="${esc(o.date||today())}"></label><label class="field">Rok plačila / veljavnost<input type="date" name="due" value="${esc(o.due||today())}"></label><label class="field">DDV (%)<input type="number" step="0.1" min="0" max="100" name="vat" value="${esc(o.vat??db.company.defaultVat)}"></label><label class="field">Status<select name="status">${(type==='offers'?['Osnutek','Poslano','Potrjeno','Zavrnjeno']:['Osnutek','Poslano','Plačano','Zamuda']).map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="field span2">Opis / opomba<textarea name="desc">${esc(o.desc||'')}</textarea></label></div><h3>Postavke</h3><div class="invoicerows linehead"><span>Opis</span><span>Količina</span><span>Cena/enoto</span><span>Skupaj</span><span></span></div><div id="itemrows"></div><div class="actions" style="margin-top:12px"><button type="button" class="btn small" onclick="addItem()">＋ Dodaj postavko</button></div><p style="text-align:right;margin-top:15px"><b>Skupaj brez DDV: <span id="docTotal"></span></b></p><footer><button type="button" class="btn" onclick="closeModal()">Prekliči</button><button type="submit" class="btn primary">Shrani osnutek</button></footer></form>`);renderItems()}
function renderItems(){let el=document.getElementById('itemrows');if(!el)return;const offer=docType==='offers'||docType==='invoices'&&document.getElementById('offerGross');el.innerHTML=docItems.map((x,i)=>offer?`<div class="invoicerows" style="grid-template-columns:2.5fr .7fr .8fr 1fr 1fr 1fr;margin:5px 0"><input aria-label="Opis" value="${esc(x.desc)}" oninput="updateItem(${i},'desc',this.value)"><input aria-label="Enota" value="${esc(x.unit||'kpl')}" oninput="updateItem(${i},'unit',this.value)"><input aria-label="Količina" type="text" inputmode="decimal" value="${x.qty}" oninput="updateItem(${i},'qty',this.value)"><input aria-label="Cena" type="text" inputmode="decimal" value="${moneyNumber(x.price)}" oninput="updateItem(${i},'price',this.value)"><span>${fmt(x.qty*x.price)}</span><button type="button" class="btn small" onclick="removeItem(${i})">×</button></div>`:`<div class="invoicerows" style="margin:5px 0"><input aria-label="Opis" value="${esc(x.desc)}" oninput="updateItem(${i},'desc',this.value)"><input aria-label="Količina" type="text" inputmode="decimal" value="${x.qty}" oninput="updateItem(${i},'qty',this.value)"><input aria-label="Cena" type="text" inputmode="decimal" value="${moneyNumber(x.price)}" oninput="updateItem(${i},'price',this.value)"><span>${fmt(x.qty*x.price)}</span><button type="button" class="btn small" onclick="removeItem(${i})">×</button></div>`).join('');document.getElementById('docTotal').textContent=fmt(sum(docItems,x=>x.qty*x.price));if(offer)refreshOfferTotals()}
function updateItem(i,k,v){docItems[i][k]=k==='desc'||k==='unit'?v:moneyParse(v);let rows=document.getElementById('itemrows');let row=rows.children[i];if(row)row.children[(docType==='offers'||docType==='invoices'&&document.getElementById('offerGross'))?4:3].textContent=fmt(docItems[i].qty*docItems[i].price);document.getElementById('docTotal').textContent=fmt(sum(docItems,x=>x.qty*x.price));if(docType==='offers'||docType==='invoices')refreshOfferTotals()}function addItem(){docItems.push({desc:'',unit:'kpl',qty:1,price:0});renderItems()}function removeItem(i){docItems.splice(i,1);renderItems()}
function submitDoc(e,type,edit){e.preventDefault();if(!docItems.length)return toast('Dodaj vsaj eno postavko');if(type==='invoices'&&e.target.elements.taxMode?.value==='reverse'&&!String(e.target.elements.offerClientTax?.value||'').trim())return toast('Za 76.a člen vpiši ID za DDV naročnika');let obj=Object.fromEntries(new FormData(e.target));obj.items=clone(docItems);obj.vat=Number(obj.vat)||0;if(type==='offers')obj.due=obj.paymentTerms||'';if(type==='invoices')obj.due=obj.dueDate||'';obj.amount=sum(docItems,x=>x.qty*x.price);let savedDoc;if(edit){savedDoc=db[type].find(x=>x.id===edit);if(savedDoc)Object.assign(savedDoc,obj)}else{savedDoc={id:id(),...obj};db[type].push(savedDoc)}if(type==='invoices')completeProjectForPaidInvoice(savedDoc);save();if(type==='offers'||type==='invoices'){go(type)}else{closeModal();render()}toast('Dokument shranjen kot osnutek')}
function createOfferFromProject(projectId){const p=db.projects.find(x=>x.id===projectId);if(!p)return;let offer=db.offers.find(o=>o.sourceProjectId===projectId);if(!offer){const amount=typeof window.zagorcMeasurementPrice==='function'&&Object.keys(p.measurements||{}).length?Number(window.zagorcMeasurementPrice(p.measurements,false))||0:moneyParse(projectPriceLabel(p,false));const vat=String(Object.values(p.measurements||{})[0]?.impalaCells?.vatRate)==='9.5'?9.5:22;offer={id:id(),number:nextOfferNumber(),sourceProjectId:projectId,client:p.client,date:today(),status:'Osnutek',desc:p.name+(p.objectLocation?' – '+p.objectLocation:''),items:[{desc:p.name,unit:'kpl',qty:1,price:Math.round(amount*100)/100}],amount:Math.round(amount*100)/100,vat};db.offers.push(offer);save()}openDoc('offers',offer.id)}
function createInvoiceFromProject(projectId){const p=db.projects.find(x=>x.id===projectId);if(!p)return;const offer=db.offers.find(o=>o.sourceProjectId===projectId);if(offer){convert(offer.id);return;}const amount=Number(projectPriceLabel(p,false).replace(/[^0-9,]/g,'').replace(',','.'))||0;if(!amount){toast('Najprej vnesi mere in ceno projekta');return;}const existing=db.invoices.find(i=>i.sourceProjectId===projectId);if(existing){go('invoices');toast('Račun za ta projekt že obstaja');return;}const vat=String(Object.values(p.measurements||{})[0]?.impalaCells?.vatRate)==='9.5'?9.5:22;db.invoices.push({id:id(),number:nextInvoiceNumber(),sourceProjectId:projectId,client:p.client,date:today(),due:today(),status:'Osnutek',desc:p.name+(p.objectLocation?' – '+p.objectLocation:''),items:[{desc:p.name,qty:1,price:Math.round(amount*100)/100}],amount:Math.round(amount*100)/100,vat});save();go('invoices');toast('Ustvarjen osnutek računa');}
function convert(uid){const x=db.offers.find(o=>o.id===uid);if(!x)return;const existing=db.invoices.find(i=>i.sourceOfferId===x.id||(x.sourceProjectId&&i.sourceProjectId===x.sourceProjectId));if(existing){openDoc('invoices',existing.id);return;}const newInvoice={...clone(x),id:id(),number:nextInvoiceNumber(),date:today(),due:today(),dueDate:'',status:'Osnutek',sourceOffer:x.number,sourceOfferId:x.id};db.invoices.push(newInvoice);save();openDoc('invoices',newInvoice.id);toast('Račun iz ponudbe je pripravljen za urejanje');}

function shelfTotals(sec){let area=0,edge=0;for(const r of sec.rows){const l=n(r.length),w=n(r.width),q=n(r.qty);area+=l*w*q/10000;edge+=l*q/100;}return {area,edge,cost:area*n(sec.surface)+edge*n(sec.edge)};}
window.zagorcMaterialPrice=function(name,t){if(!t)return 0;if(name==='PRAZEN LIST')return n(t.price);if(stoneRates[name]){sections.forEach((sec,i)=>sec.rate=stoneRates[name][i]);return compute(t).B57;}if(shelfDefaults[name])return shelfData(t,name).reduce((sum,sec)=>sum+shelfTotals(sec).cost,0);return 0;};
function renderShelves(t,name,extra=false,additional=0){const data=shelfData(t,name);let sum=0;let html='<section class="measurement-editor impala-original shelf-editor"><h3>NALOG '+safe(name)+'</h3><p class="help">Mere v centimetrih. Cena površine je na m², cena robov na tekoči meter.</p>';data.forEach((sec,si)=>{const totals=shelfTotals(sec);sum+=totals.cost;html+='<h4 style="padding:9px;background:#e8eef3;margin-top:15px">'+safe(shelfDefaults[name][si].title)+'</h4><div class="tablewrap impala-measures"><table><thead><tr><th>Dolžina (cm)</th><th>Širina (cm)</th><th>Kosov</th><th>Skupaj (m²)</th><th>Rob (m)</th><th></th></tr></thead><tbody>';sec.rows.forEach((r,ri)=>{html+='<tr>'+['length','width','qty'].map(k=>'<td><div style="display:flex;align-items:center;gap:4px"><input style="width:72px" type="text" inputmode="decimal" value="'+safe(r[k]??'')+'" onchange="shelfChange('+si+','+ri+',\''+k+'\',this.value)">'+(k==='qty'?'':'<span>cm</span>')+'</div></td>').join('')+'<td>'+(n(r.length)*n(r.width)*n(r.qty)/10000).toFixed(3)+'</td><td>'+(n(r.length)*n(r.qty)/100).toFixed(3)+'</td><td><button type="button" class="textbtn" onclick="shelfRemove('+si+','+ri+')">Odstrani</button></td></tr>';});html+='</tbody></table></div><button type="button" class="btn" onclick="shelfAdd('+si+')">+ Dodaj vrstico</button><div style="padding:10px;background:#f4f6f8;margin-top:8px">Skupaj kvadratnih metrov: <b>'+totals.area.toFixed(3)+'</b> m² · Skupaj robov: <b>'+totals.edge.toFixed(3)+'</b> m</div><div style="padding:10px;background:#f4f6f8">Cena m²: <input type="text" inputmode="decimal" style="width:75px" value="'+safe(sec.surface)+'" onchange="shelfRate('+si+',\'surface\',this.value)"> € · Cena robov / m: <input type="text" inputmode="decimal" style="width:75px" value="'+safe(sec.edge)+'" onchange="shelfRate('+si+',\'edge\',this.value)"> € · Vrednost: <b>'+moneyNumber(totals.cost)+'</b> €</div>';});if(!extra)sum+=additional;const c=sheet(t),vat=String(c.vatRate)==='9.5'?9.5:22;html+='<div style="padding:15px;background:#e5f0e8;margin-top:14px">Material in robovi / Cena brez DDV: <b>'+moneyNumber(sum)+'</b> €</div><div style="padding:15px;background:#f4f6f8;margin-top:10px">DDV: <select onchange="shelfSettings(\'vatRate\',this.value)">'+[22,9.5].map(v=>'<option value="'+v+'"'+(vat===v?' selected':'')+'>'+v+' %</option>').join('')+'</select> · Znesek DDV: <b>'+moneyNumber((sum*vat/100))+'</b> €</div><div style="padding:15px;background:#e5f0e8;margin-top:10px">Cena z DDV: <b>'+moneyNumber((sum*(1+vat/100)))+'</b> €</div></section>';if(extra){const cut=html.indexOf('<div style="padding:15px;background:#f4f6f8;margin-top:10px">DDV:');if(cut>=0)html=html.slice(0,cut)+'</section>';}return html;}
function shelfActive(){const name=activeMeasurementTemplate||Object.keys(draftMeasurements)[0];const t=draftMeasurements[name];return t&&shelfDefaults[name]?{name,t,data:shelfData(t,name)}:null;}
function shelfRefresh(){const el=document.getElementById('measurement-editors');if(el)el.innerHTML=measurementEditors(draftMeasurements);if(page==='project-measurements')saveProjectMeasurements(false);}
window.shelfChange=function(si,ri,k,v){const x=shelfActive();if(!x)return;x.data[si].rows[ri][k]=v;shelfRefresh();};
window.shelfAdd=function(si){const x=shelfActive();if(!x)return;x.data[si].rows.push({length:'',width:'',qty:1});shelfRefresh();};
window.shelfRemove=function(si,ri){const x=shelfActive();if(!x)return;x.data[si].rows.splice(ri,1);shelfRefresh();};
window.shelfRate=function(si,k,v){const x=shelfActive();if(!x)return;x.data[si][k]=v;shelfRefresh();};
window.shelfSettings=function(k,v){const x=shelfActive();if(!x)return;sheet(x.t)[k]=v;shelfRefresh();};


let activeMeasurementTemplate='';
function measurementPrimaryName(templates){return Object.keys(templates||{}).slice(-1)[0]||'';}
function measurementGrandTotal(templates,withVat){const names=Object.keys(templates||{});if(!names.length)return 0;const primary=names[names.length-1],t=templates[primary];const material=names.reduce((sum,name)=>sum+projectMaterialPrice(name,templates[name]),0);const manufacture=stoneRates[primary]?(t.impalaCells?.manufacturePrice===undefined?800:n(t.impalaCells.manufacturePrice)):0;const vat=primary==='PRAZEN LIST'?n(t.vatRate)||22:String(t.impalaCells?.vatRate)==='9.5'?9.5:22;return (material+manufacture)*(withVat?1+vat/100:1);}
window.zagorcMeasurementPrice=measurementGrandTotal;
function refreshMeasurementTotals(){const templates=draftMeasurements||{},entries=Object.entries(templates);if(!entries.length)return;const primary=entries[entries.length-1][0],extra=measurementAdditionalMaterial(templates);document.querySelectorAll('.combined-measurement-summary').forEach(el=>{el.outerHTML=combinedMeasurementSummary(templates)});const section=[...document.querySelectorAll('.measurement-editor[data-template]')].find(el=>el.getAttribute('data-template')===primary);if(!section)return;const t=templates[primary],material=projectMaterialPrice(primary,t)+extra;const make=stoneRates[primary]?(t.impalaCells?.manufacturePrice===undefined?800:n(t.impalaCells.manufacturePrice)):0;const vat=String(t.impalaCells?.vatRate)==='9.5'?9.5:22;const values={B57:material,FINAL:material+make,VAT_AMOUNT:(material+make)*vat/100,WITH_VAT:(material+make)*(1+vat/100)};section.querySelectorAll('[data-impala-result]').forEach(el=>{const k=el.getAttribute('data-impala-result');if(k in values)el.textContent=moneyNumber(values[k]);});}
function combinedMeasurementSummary(templates){const entries=Object.entries(templates||{});if(entries.length<2)return '';const primary=entries[entries.length-1][0];const material=entries.map(([name,t])=>({name,value:projectMaterialPrice(name,t)}));const total=material.reduce((sum,x)=>sum+x.value,0);return '<div class="combined-measurement-summary" style="padding:15px;background:#e5f0e8;margin-top:12px"><b>Skupni material vseh predlog</b>'+material.map(x=>'<div style="margin-top:6px">'+safe(x.name)+': <b>'+moneyNumber(x.value)+' €</b></div>').join('')+'<div style="margin-top:10px;border-top:1px solid #9ba7b4;padding-top:10px"><b>Skupaj material: '+moneyNumber(total)+' €</b></div></div>';}
function measurementAdditionalMaterial(templates){const primary=measurementPrimaryName(templates);return Object.entries(templates||{}).reduce((sum,[name,t])=>sum+(name===primary?0:projectMaterialPrice(name,t)),0);}
measurementEditors=function(templates){const entries=Object.entries(templates||{}),primary=measurementPrimaryName(templates),additional=measurementAdditionalMaterial(templates);return entries.map(([name,t])=>{const extra=entries.length>1&&name!==primary;let html=name==='PRAZEN LIST'?renderBlankSheet(t):stoneRates[name]?renderImpala(t,name,extra,extra?0:additional):shelfDefaults[name]?renderShelves(t,name,extra,extra?0:additional):originalEditor({[name]:t});if(extra&&name==='PRAZEN LIST'){const i=html.indexOf('<label class="field">DDV<select');if(i>=0){const j=html.indexOf('</select></label>',i);if(j>=0)html=html.slice(0,i)+html.slice(j+17);}}if(!extra&&entries.length>1){const summary=combinedMeasurementSummary(templates);const marker='<div style="padding:15px;background:#e5f0e8;margin-top:14px">Material skupaj:';const at=html.indexOf(marker);if(at>=0)html=html.slice(0,at)+summary+html.slice(at);else html=html.replace('</section>',summary+'</section>');}return html.replace('<section class="measurement-editor','<section data-template="'+safe(name)+'" class="measurement-editor');}).join('');};
document.addEventListener('focusin',function(e){const section=e.target.closest('.measurement-editor[data-template]');if(section)activeMeasurementTemplate=section.getAttribute('data-template');},true);
document.addEventListener('click',function(e){const section=e.target.closest('.measurement-editor[data-template]');if(section)activeMeasurementTemplate=section.getAttribute('data-template');},true);
const oldSelect=selectMeasurementTemplate;
selectMeasurementTemplate=function(name){oldSelect(name);};
render();
impalaRemoveSpinners();
})();
</script><script>
(function(){
  function removeImpalaNumberArrows(){
    document.querySelectorAll('.impala-original input[type="number"]').forEach(function(el){
      el.setAttribute('type','text');
      el.setAttribute('inputmode','decimal');
      el.removeAttribute('step');
    });
  }
  document.addEventListener('focusin',function(e){
    if(e.target.closest('.impala-original'))removeImpalaNumberArrows();
  },true);
  new MutationObserver(removeImpalaNumberArrows).observe(document.documentElement,{childList:true,subtree:true});
  removeImpalaNumberArrows();
})();
</script><script>
(function(){
  // Puščice med vsemi vnosnimi polji projekta, tudi med različnimi tabelami.
  document.addEventListener('keydown',function(e){
    if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
    const el=e.target;
    if(!el.matches||!el.matches('input,textarea,select'))return;
    const root=el.closest('#editor,#measurement-editors,.modal');
    if(!root)return;
    const inputs=[...root.querySelectorAll('input:not([type=hidden]),textarea,select')].filter(x=>!x.disabled&&x.getClientRects().length);
    const index=inputs.indexOf(el);if(index<0)return;
    const table=el.closest('table'),row=el.closest('tr');
    let target=null;
    if(table&&row){
      const rows=[...table.querySelectorAll('tbody tr')],ri=rows.indexOf(row),cols=[...row.querySelectorAll('input,textarea,select')],ci=cols.indexOf(el);
      if(ri>=0&&ci>=0){
        if(e.key==='ArrowUp'||e.key==='ArrowDown'){
          const nr=rows[ri+(e.key==='ArrowUp'?-1:1)];
          if(nr)target=[...nr.querySelectorAll('input,textarea,select')][ci];
        }else target=cols[ci+(e.key==='ArrowLeft'?-1:1)];
      }
    }
    // Ob robu tabele nadaljuj v naslednji/prejšnji razdelek.
    if(!target){
      const step=(e.key==='ArrowLeft'||e.key==='ArrowUp')?-1:1;
      target=inputs[index+step];
    }
    if(!target)return;
    e.preventDefault();target.focus();
    if(target.select&&target.tagName==='INPUT')target.select();
  },true);
})();
</script></body></html>
