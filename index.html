const tabs=[['home','Domov','⌂'],['clients','Stranke','♙'],['offers','Ponudbe','▤'],['invoices','Računi','▣'],['projects','Projekti','▧'],['expenses','Stroški','↘'],['stock','Zaloga','◫'],['reports','Poročila','▥'],['settings','Nastavitve','⚙']];
const key='zagorc_demo_v1';const sample={clients:[{id:'c1',name:'Vzorčna stranka – Janez Novak',email:'primer@example.com',phone:'',address:'Primer naslov, Slovenija',tax:''},{id:'c2',name:'Vzorčna stranka – Podjetje d.o.o.',email:'',phone:'',address:'',tax:''}],offers:[{id:'o1',number:'P-2026-001',client:'c1',date:'2026-11-12',due:'2026-12-12',desc:'Nagrobni spomenik – granit Impala',amount:1800,vat:22,status:'Osnutek',items:[{desc:'Izdelava in montaža spomenika – Impala',qty:1,price:1800}]}],invoices:[],projects:[{id:'p1',name:'Vzorčni spomenik Impala',client:'c1',status:'V izdelavi',budget:1800,deadline:'2026-12-10',notes:'Primer projekta'}],expenses:[{id:'e1',date:'2026-11-10',supplier:'Vzorčni dobavitelj',category:'Material',desc:'Granit Impala (primer)',amount:420}],stock:[{id:'s1',name:'Granit Impala',unit:'m²',qty:16,minimum:5,price:105},{id:'s2',name:'Granit New Cristal',unit:'m²',qty:8,minimum:4,price:98}],company:{name:'Kamnoseštvo Zagorc / ZAGI TEAM d.o.o.',address:'',tax:'',iban:'',email:'',phone:'',defaultVat:22}};
const clone=o=>JSON.parse(JSON.stringify(o));let db;try{db=JSON.parse(localStorage.getItem(key))||clone(sample)}catch(e){db=clone(sample)};let page='home',selectedProjectId='',modal='',docType='offers',docItems=[];const fmt=n=>new Intl.NumberFormat('sl-SI',{style:'currency',currency:'EUR'}).format(Number(n)||0),dateFmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('sl-SI'):'—';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const findClient=id=>db.clients.find(x=>x.id===id)?.name||'Neznana stranka';const save=()=>{try{localStorage.setItem(key,JSON.stringify(db))}catch(e){toast('Shranjevanje ni uspelo – izvozi varnostno kopijo.')}};const id=()=>Math.random().toString(36).slice(2,10);const today=()=>new Date().toISOString().slice(0,10);const totalDoc=o=>o.amount*(1+(Number(o.vat)||0)/100);const sum=(arr,fn)=>arr.reduce((a,x)=>a+(Number(fn(x))||0),0);function toast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display='none',3000)}
function render(){document.getElementById('nav').innerHTML=tabs.map(([k,n,i])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span class="emoji">${i}</span>${n}</button>`).join('');let title=page==='project-measurements'?'Urejanje izmer':page==='project-new'?'Nov projekt':page==='project-detail'?(db.projects.find(p=>p.id===selectedProjectId)?.name||'Projekt'):(tabs.find(x=>x[0]===page)?.[1]||'Domov');document.getElementById('app').innerHTML=`<header class="top"><div><div class="eyebrow">KAMNOSEŠTVO ZAGORC / POSLOVANJE</div><h1>${esc(title)}</h1><p class="subtitle">Vsi podatki podjetja na enem mestu.</p></div><span class="chip">● DEMO</span></header><div class="notice">To je preizkusna različica z vzorčnimi podatki. Ustvarjeni dokumenti so <b>osnutki</b>, ne davčno potrjeni računi ali uradne računovodske evidence.</div>${views[page]() }<div class="disclaimer">ZAGORC · Prototip v1 · Shranjevanje v brskalniku. Za poslovno uporabo je potrebna varna strežniška različica.</div>`}

function status(x){let c=x==='Plačano'||x==='Potrjeno'||x==='Zaključeno'?'green':x==='Zamuda'?'red':'amber';return `<span class="pill ${c}">${esc(x||'Osnutek')}</span>`}
function listRows(items,headers,fn){return items.length?`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${items.map(fn).join('')}</tbody></table></div>`:'<div class="empty">Trenutno ni vnosov. Dodaj prvega z gumbom zgoraj.</div>'}
function home(){let revenue=sum(db.invoices.filter(x=>x.status==='Plačano'),totalDoc), billed=sum(db.invoices,totalDoc),cost=sum(db.expenses,x=>x.amount),unpaid=sum(db.invoices.filter(x=>x.status!=='Plačano'),totalDoc);return `<div class="grid"><div class="stat"><span class="sicon">↗</span><label>Plačani računi (z DDV)</label><strong>${fmt(revenue)}</strong><small>${db.invoices.filter(x=>x.status==='Plačano').length} plačil</small></div><div class="stat"><span class="sicon">↘</span><label>Vpisani stroški</label><strong>${fmt(cost)}</strong><small>Prikaz vnesenih zneskov</small></div><div class="stat"><span class="sicon">▤</span><label>Izdani osnutki računov</label><strong>${fmt(billed)}</strong><small>Z DDV</small></div><div class="stat"><span class="sicon">◷</span><label>Neplačani osnutki</label><strong>${fmt(unpaid)}</strong><small>Ni usklajeno z banko</small></div></div><div class="two"><div class="panel"><h2>Hitri dostop</h2><div class="quick">${[['＋','Nova ponudba',"openForm('offers')"],['▣','Nov račun',"openForm('invoices')"],['♙','Nova stranka',"openForm('clients')"],['↘','Dodaj strošek',"openForm('expenses')"],['◫','Dodaj zalogo',"openForm('stock')"],['▧','Nov projekt',"go('project-new')"]].map(x=>`<button class="tile" onclick="${x[2]}"><span>${x[0]}</span>${x[1]}</button>`).join('')}</div></div><div class="panel"><h2>Aktivni projekti</h2>${db.projects.length?db.projects.slice(0,5).map(x=>`<div style="border-bottom:1px solid #edf0f3;padding:12px 0;display:flex;justify-content:space-between;gap:7px"><div><button type="button" class="project-link" onclick="openProject(&quot;${x.id}&quot;)">${esc(x.name)}</button><div class="help">${esc(findClient(x.client))}</div></div>${status(x.status)}</div>`).join(''):'<p class="muted">Brez projektov.</p>'}<button class="btn small" style="margin-top:15px" onclick="go('projects')">Vsi projekti</button></div></div><div class="panel spaced"><h2>Zadnje ponudbe</h2>${listRows(db.offers.slice(-5).reverse(),['Številka','Stranka','Datum','Vrednost z DDV','Status'],x=>`<tr><td><b>${esc(x.number)}</b></td><td>${esc(findClient(x.client))}</td><td>${dateFmt(x.date)}</td><td>${fmt(totalDoc(x))}</td><td>${status(x.status)}</td></tr>`)}</div>`}
function headerBtn(label,fn){return `<div class="sectiontop"><h2>${label}</h2><button class="btn primary" onclick="${fn}">＋ Dodaj novo</button></div>`}
const views={'project-measurements':projectMeasurementsPage,'project-new':newProjectPage,'project-detail':projectDetail,home,clients:()=>`${headerBtn('Imenik strank',"openForm('clients')")}${listRows(db.clients,['Naziv','E-pošta','Telefon','Naslov',''],x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.email||'—')}</td><td>${esc(x.phone||'—')}</td><td>${esc(x.address||'—')}</td><td><button class="textbtn" onclick="openForm('clients','${x.id}')">Uredi</button></td></tr>`)}`,offers:()=>docList('offers'),invoices:()=>docList('invoices'),projects:()=>`${headerBtn('Delovni nalogi in projekti',"go('project-new')")}${listRows(db.projects,['Projekt','Stranka','Rok','Vrednost','Status'],x=>`<tr class="project-row" tabindex="0" role="link" onclick="openProject(&quot;${x.id}&quot;)" onkeydown="if(event.key===&quot;Enter&quot;)openProject(&quot;${x.id}&quot;)"><td><b>${esc(x.name)}</b></td><td>${esc(findClient(x.client))}</td><td>${dateFmt(x.deadline)}</td><td>${fmt(x.budget)}</td><td>${status(x.status)}</td></tr>`)}`,expenses:()=>`${headerBtn('Prejeti računi in stroški',"openForm('expenses')")}${listRows(db.expenses,['Datum','Dobavitelj','Vrsta','Opis','Znesek',''],x=>`<tr><td>${dateFmt(x.date)}</td><td><b>${esc(x.supplier)}</b></td><td>${esc(x.category)}</td><td>${esc(x.desc)}</td><td>${fmt(x.amount)}</td><td><button class="textbtn" onclick="openForm('expenses','${x.id}')">Uredi</button></td></tr>`)}`,stock:()=>`${headerBtn('Zaloga materiala',"openForm('stock')")}${listRows(db.stock,['Material','Količina','Min. zaloga','Cena / enoto','Vrednost',''],x=>`<tr><td><b>${esc(x.name)}</b></td><td>${Number(x.qty)} ${esc(x.unit)}</td><td>${Number(x.minimum)} ${esc(x.unit)}</td><td>${fmt(x.price)}</td><td>${fmt(x.qty*x.price)}</td><td><button class="textbtn" onclick="openForm('stock','${x.id}')">Uredi</button></td></tr>`)}`,reports,settings};
function docList(type){let arr=db[type],name=type==='offers'?'ponudb':'računov';return `${headerBtn('Pregled '+name,`openForm('${type}')`)}${listRows(arr,['Številka','Stranka','Datum','Znesek brez DDV','Z DDV','Status','Dejanja'],x=>`<tr><td><b>${esc(x.number)}</b></td><td>${esc(findClient(x.client))}</td><td>${dateFmt(x.date)}</td><td>${fmt(x.amount)}</td><td>${fmt(totalDoc(x))}</td><td>${status(x.status)}</td><td><button class="textbtn" onclick="printDoc('${type}','${x.id}')">Natisni / PDF</button> <button class="textbtn" onclick="openForm('${type}','${x.id}')">Uredi</button>${type==='offers'?` <button class="textbtn" onclick="convert('${x.id}')">→ Račun</button>`:''}</td></tr>`)}`}
function reports(){let income=sum(db.invoices.filter(x=>x.status==='Plačano'),x=>x.amount),cost=sum(db.expenses,x=>x.amount),exposure=sum(db.invoices.filter(x=>x.status!=='Plačano'),x=>x.amount),inv=sum(db.stock,x=>x.qty*x.price),max=Math.max(income,cost,1);return `<div class="report"><div class="panel"><h2>Operativni pregled (informativno)</h2><div class="bars"><div class="barrow"><b>Prihodki*</b><div class="bar"><span style="width:${income/max*100}%"></span></div><small>${fmt(income)}</small></div><div class="barrow"><b>Stroški**</b><div class="bar"><span style="width:${cost/max*100}%;background:#d3a45e"></span></div><small>${fmt(cost)}</small></div></div><h2 style="margin-top:25px">Razlika prikazanih zneskov: ${fmt(income-cost)}</h2><p class="help">* Plačani osnutki računov brez DDV. ** Vneseni stroški, brez razločevanja davčne osnove in DDV. Rezultat ni dobiček podjetja ali računovodska bilanca.</p></div><div class="panel"><h2>Drugi kazalniki</h2><p>Neplačani osnutki brez DDV: <b>${fmt(exposure)}</b></p><p>Ocenjena vrednost zaloge: <b>${fmt(inv)}</b></p><p>Število projektov: <b>${db.projects.length}</b></p><p>Število strank: <b>${db.clients.length}</b></p><p class="help">Za uradno bilanco so potrebni dvostavno knjigovodstvo, kontni načrt, obračuni, knjiženje in kontrola.</p></div></div>`}
function settings(){let c=db.company;return `<div class="panel"><h2>Podatki podjetja</h2><form onsubmit="saveSettings(event)" class="formgrid"><label class="field span2">Naziv podjetja<input name="name" value="${esc(c.name)}" required></label><label class="field">Naslov<input name="address" value="${esc(c.address)}"></label><label class="field">Davčna številka / ID za DDV<input name="tax" value="${esc(c.tax)}"></label><label class="field">IBAN<input name="iban" value="${esc(c.iban)}"></label><label class="field">E-pošta<input name="email" value="${esc(c.email)}"></label><label class="field">Telefon<input name="phone" value="${esc(c.phone)}"></label><label class="field">Privzeti DDV (%)<input name="defaultVat" type="number" min="0" max="100" step="0.1" value="${esc(c.defaultVat)}"></label><div class="span2"><button class="btn primary">Shrani podatke</button></div></form></div><div class="panel spaced"><h2>Podatki in varnostne kopije</h2><p class="muted">Podatki niso v oblaku. Če počistiš brskalnik ali zamenjaš napravo, lahko izginejo.</p><div class="actions"><button class="btn primary" onclick="exportData()">↓ Izvozi podatke JSON</button><button class="btn" onclick="document.getElementById('importfile').click()">↑ Uvozi JSON</button><input type="file" id="importfile" accept="application/json,.json" style="display:none" onchange="importData(event)"><button class="btn danger" onclick="resetDemo()">Ponastavi demo</button></div></div>`}
function saveSettings(e){e.preventDefault();db.company=Object.fromEntries(new FormData(e.target));db.company.defaultVat=Number(db.company.defaultVat);save();toast('Podatki shranjeni.');render()}
const fields={clients:[['name','Ime / naziv','text',1],['email','E-pošta','email'],['phone','Telefon','tel'],['address','Naslov','text'],['tax','Davčna številka','text']],projects:[['name','Naziv projekta','text',1],['clientName','Ime in priimek / naziv stranke','text',1],['clientPhone','Telefon stranke','tel'],['clientEmail','E-pošta stranke','email'],['clientAddress','Naslov stranke','text'],['clientTax','Davčna številka stranke','text'],['deadline','Predviden rok','date'],['budget','Predvidena vrednost (€)','number'],['status','Status','select:V pripravi|V izdelavi|Montaža|Zaključeno'],['notes','Opombe','textarea']],expenses:[['date','Datum','date',1],['supplier','Dobavitelj','text',1],['category','Kategorija','select:Material|Stroji|Prevoz|Plače|Najemnina|Energija|Drugo'],['desc','Opis stroška','text'],['amount','Znesek (€)','number',1]],stock:[['name','Material','text',1],['unit','Enota','select:m²|kos|m|kg'],['qty','Količina','number',1],['minimum','Minimalna zaloga','number'],['price','Nabavna cena za enoto (€)','number']]};
function fieldHTML(f,v){let [k,label,type,req]=f,value=v?.[k]??(type==='date'?today():'');if(type==='client')return `<label class="field">${label}<select name="${k}" required><option value="">Izberi stranko</option>${db.clients.map(c=>`<option value="${c.id}" ${value===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`;if(type==='textarea')return `<label class="field span2">${label}<textarea name="${k}">${esc(value)}</textarea></label>`;if(type.startsWith('select:'))return `<label class="field">${label}<select name="${k}">${type.slice(7).split('|').map(s=>`<option ${value===s?'selected':''}>${esc(s)}</option>`).join('')}</select></label>`;return `<label class="field">${label}<input name="${k}" type="${type}" value="${esc(value)}" ${req?'required':''} ${type==='number'?'step="0.01"':''}></label>`}
function openProject(projectId){if(!db.projects.some(x=>x.id===projectId)){toast('Projekta ni mogoče najti');return}selectedProjectId=projectId;page='project-detail';render();scrollTo(0,0)}

const measurementTemplates=["PARADISO","HIMALAJA","IMPALA","LABRADOR","NERO Belfast","NERO Kitajc","NERO Pretoria","OLIVA","POLICE ena debelina","POLICE VEČ DEBELIN","VISCONT WHITE"];
let draftMeasurements={};
function measurementPicker(){const selected=Object.keys(draftMeasurements)[0];return '<section class="measurement-section"><h2>Izmere – Excelove predloge</h2>'+(selected?'<div class="sectiontop"><h3>Izbrana predloga: '+esc(selected)+'</h3><button type="button" class="btn" onclick="changeMeasurementTemplate()">Zamenjaj predlogo</button></div>':'<p class="help">Izberi eno predlogo za ta projekt.</p><div class="measurement-choices">'+measurementTemplates.map(n=>'<button type="button" class="btn measurement-choice" onclick="selectMeasurementTemplate(decodeURIComponent(\''+encodeURIComponent(n)+'\'))">'+esc(n)+'</button>').join('')+'</div>')+'<div id="measurement-editors">'+measurementEditors(draftMeasurements)+'</div></section>'}
function selectMeasurementTemplate(n){draftMeasurements={[n]:draftMeasurements[n]||{rows:[]}};refreshMeasurementPicker();if(page==='project-measurements')saveProjectMeasurements(false)}
function changeMeasurementTemplate(){if(!confirm('Zamenjava predloge odstrani izmere trenutne predloge iz tega projekta. Nadaljujem?'))return;draftMeasurements={};refreshMeasurementPicker();if(page==='project-measurements')saveProjectMeasurements(false)}
function refreshMeasurementPicker(){const el=document.querySelector('.measurement-section');if(el)el.outerHTML=measurementPicker()}
function toggleMeasurementTemplate(el,n){selectMeasurementTemplate(n)}
function measurementEditors(templates){return Object.entries(templates||{}).map(([n,t])=>'<section class="measurement-editor"><h3>'+esc(n)+'</h3><p class="help">Vpis izmer. Izračun površine je v m² (mere v cm). Osnovna tabela izmer; originalni Excelovi izračuni in oblikovanje še niso preneseni.</p><div class="tablewrap"><table><thead><tr><th>Element</th><th>Dolžina (cm)</th><th>Širina (cm)</th><th>Kosov</th><th>m²</th><th></th></tr></thead><tbody>'+((t.rows||[]).map((r,i)=>measurementRow(n,r,i)).join(''))+'</tbody></table></div><button type="button" class="btn" onclick="addMeasurementRow(decodeURIComponent(\''+encodeURIComponent(n)+'\'))">+ Dodaj vrstico</button></section>').join('')}
function measurementRow(n,r,i){return '<tr><td><input aria-label="Element" value="'+esc(r.name||'')+'" onchange="changeMeasurement(decodeURIComponent(\''+encodeURIComponent(n)+'\'),'+i+',\'name\',this.value)"></td>'+['length','width','qty'].map(k=>'<td><input type="number" step="any" aria-label="'+k+'" value="'+esc(r[k]??'')+'" onchange="changeMeasurement(decodeURIComponent(\''+encodeURIComponent(n)+'\'),'+i+',\''+k+'\',this.value)"></td>').join('')+'<td>'+(((+r.length||0)*(+r.width||0)*(+r.qty||0))/10000).toFixed(3)+'</td><td><button type="button" class="textbtn" onclick="removeMeasurementRow(decodeURIComponent(\''+encodeURIComponent(n)+'\'),'+i+')">Odstrani</button></td></tr>'}
function addMeasurementRow(n){draftMeasurements[n].rows.push({name:'',length:'',width:'',qty:1});document.getElementById('measurement-editors').innerHTML=measurementEditors(draftMeasurements);if(page==='project-measurements')saveProjectMeasurements(false)}
function removeMeasurementRow(n,i){draftMeasurements[n].rows.splice(i,1);document.getElementById('measurement-editors').innerHTML=measurementEditors(draftMeasurements);if(page==='project-measurements')saveProjectMeasurements(false)}
function changeMeasurement(n,i,k,v){draftMeasurements[n].rows[i][k]=v;const table=document.getElementById('measurement-editors');const tr=table?.querySelectorAll('.measurement-editor')[Object.keys(draftMeasurements).indexOf(n)]?.querySelectorAll('tbody tr')[i];if(tr){const r=draftMeasurements[n].rows[i];tr.children[4].textContent=(((+r.length||0)*(+r.width||0)*(+r.qty||0))/10000).toFixed(3)}if(page==='project-measurements')saveProjectMeasurements(false)}

function projectMeasurementsPage(){const p=db.projects.find(x=>x.id===selectedProjectId);if(!p)return '<div class="panel">Projekt ni najden.</div>';return '<div class="panel"><div class="sectiontop"><h2>Izmere: '+esc(p.name)+'</h2><button type="button" class="btn" onclick="saveProjectMeasurements(true)">Shrani in nazaj</button></div>'+measurementPicker()+'<footer><button class="btn primary" onclick="saveProjectMeasurements(true)">Shrani izmere</button></footer></div>'}
function editProjectMeasurements(){const p=db.projects.find(x=>x.id===selectedProjectId);if(!p)return;draftMeasurements=JSON.parse(JSON.stringify(p.measurements||{}));page='project-measurements';render();scrollTo(0,0)}
function saveProjectMeasurements(back){const p=db.projects.find(x=>x.id===selectedProjectId);if(!p)return;p.measurements=JSON.parse(JSON.stringify(draftMeasurements));save();if(back){page='project-detail';render();scrollTo(0,0);toast('Izmere shranjene')}}
function newProjectPage(){return `<div class="panel"><div class="sectiontop"><h2>Dodaj nov projekt</h2><button type="button" class="btn" onclick="go('projects')">← Nazaj na projekte</button></div><form id="editor" onsubmit="submitSimple(event,'projects','')"><div class="formgrid">${fields.projects.map(f=>fieldHTML(f,{})).join('')}</div>${measurementPicker()}<footer><button type="button" class="btn" onclick="go('projects')">Prekliči</button><button type="submit" class="btn primary">Shrani projekt</button></footer></form></div>`}
function projectDetail(){const p=db.projects.find(x=>x.id===selectedProjectId);if(!p)return '<div class="panel">Projekt ni najden.</div>';const c=db.clients.find(x=>x.id===p.client);const cell=(label,value,wide=false)=>'<div class="'+(wide?'wide':'')+'"><small>'+label+'</small><b>'+esc(value??'—')+'</b></div>';return '<div class="panel"><div class="sectiontop"><button class="btn" onclick="go(&quot;projects&quot;)">← Nazaj na projekte</button><button class="btn primary" onclick="openForm(&quot;projects&quot;,selectedProjectId)">Uredi projekt</button></div><h2>'+esc(p.name)+'</h2><div class="project-detail">'+cell('Stranka',c?.name)+cell('Telefon',c?.phone||'—')+cell('E-pošta',c?.email||'—')+cell('Naslov',c?.address||'—')+cell('Davčna številka',c?.tax||'—')+cell('Predviden rok',dateFmt(p.deadline))+cell('Predvidena vrednost',fmt(p.budget))+cell('Status',p.status)+cell('Opombe',p.notes||'—',true)+'</div></div>'+(p.measurements?'<div class="panel"><div class="sectiontop"><h2>Izmere projekta</h2><button class="btn primary" onclick="editProjectMeasurements()">Uredi izmere</button></div>'+Object.entries(p.measurements).map(([n,t])=>'<h3>'+esc(n)+'</h3><div class="tablewrap"><table><thead><tr><th>Element</th><th>Dolžina</th><th>Širina</th><th>Kosov</th><th>m²</th></tr></thead><tbody>'+(t.rows||[]).map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.length)+'</td><td>'+esc(r.width)+'</td><td>'+esc(r.qty)+'</td><td>'+(((+r.length||0)*(+r.width||0)*(+r.qty||0))/10000).toFixed(3)+'</td></tr>').join('')+'</tbody></table></div>').join('')+'</div>':'')}
function openForm(type,edit=''){if(type==='offers'||type==='invoices'){openDoc(type,edit);return}let o=db[type].find(x=>x.id===edit)||{};if(type==='projects'){let c=db.clients.find(c=>c.id===o.client);o={...o,clientName:c?.name||'',clientPhone:c?.phone||'',clientEmail:c?.email||'',clientAddress:c?.address||'',clientTax:c?.tax||''}}let title={clients:'stranko',projects:'projekt',expenses:'strošek',stock:'material'}[type];showModal(`<h2>${edit?'Uredi':'Dodaj'} ${title}</h2><form id="editor" onsubmit="submitSimple(event,'${type}','${edit}')"><div class="formgrid">${fields[type].map(f=>fieldHTML(f,o)).join('')}</div><footer><button type="button" class="btn" onclick="closeModal()">Prekliči</button><button class="btn primary" type="submit">Shrani</button></footer></form>`) }
function submitSimple(e,type,edit){e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));['amount','budget','qty','minimum','price'].forEach(k=>{if(k in obj)obj[k]=Number(obj[k])||0});if(type==='projects'&&page==='project-new')obj.measurements=JSON.parse(JSON.stringify(draftMeasurements));if(type==='projects'){const name=(obj.clientName||'').trim();if(!name){alert('Vpiši ime ali naziv stranke.');return}const phone=(obj.clientPhone||'').trim(),email=(obj.clientEmail||'').trim(),address=(obj.clientAddress||'').trim(),tax=(obj.clientTax||'').trim();const existingProject=edit?db.projects.find(p=>p.id===edit):null;let client=existingProject?db.clients.find(c=>c.id===existingProject.client):null;const normalized=x=>(x||'').trim().toLocaleLowerCase('sl');if(!client||normalized(client.name)!==normalized(name)){client=db.clients.find(c=>normalized(c.name)===normalized(name)&&(phone?normalized(c.phone)===normalized(phone):true))}if(!client){client={id:id(),name,phone,email,address,tax};db.clients.push(client)}else{for(const [k,v] of Object.entries({phone,email,address,tax})){if(v&&!client[k])client[k]=v}}obj.client=client.id;for(const k of ['clientName','clientPhone','clientEmail','clientAddress','clientTax'])delete obj[k]}if(edit){Object.assign(db[type].find(x=>x.id===edit),obj)}else {const newId=id();db[type].push({id:newId,...obj});if(type==='projects'&&page==='project-new'){selectedProjectId=newId;page='project-detail'}}save();closeModal();render();toast('Vnos shranjen')}
function showModal(html){closeModal();const w=document.createElement('div');w.id='overlay';w.className='modalwrap';w.innerHTML=`<div class="modal">${html}</div>`;w.addEventListener('click',e=>{if(e.target===w)closeModal()});document.body.appendChild(w)}function closeModal(){document.getElementById('overlay')?.remove()}
function openDoc(type,edit=''){let o=db[type].find(x=>x.id===edit)||{},n=type==='offers'?'Ponudba':'Osnutek računa',prefix=type==='offers'?'P':'R';docType=type;docItems=clone(o.items||[{desc:'Izdelava in montaža',qty:1,price:0}]);let no=o.number||prefix+'-'+new Date().getFullYear()+'-'+String(db[type].length+1).padStart(3,'0');showModal(`<h2>${edit?'Uredi':'Nova'} ${n.toLowerCase()}</h2><p class="help">Dokument pripraviš za pregled in PDF. Za pravno veljavno izdajo računa je potreben dodatni sistem.</p><form id="docForm" onsubmit="submitDoc(event,'${type}','${edit}')"><div class="formgrid"><label class="field">Oznaka dokumenta<input name="number" required value="${esc(no)}"></label><label class="field">Stranka<select name="client" required><option value="">Izberi stranko</option>${db.clients.map(c=>`<option value="${c.id}" ${o.client===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="field">Datum<input type="date" name="date" required value="${esc(o.date||today())}"></label><label class="field">Rok plačila / veljavnost<input type="date" name="due" value="${esc(o.due||today())}"></label><label class="field">DDV (%)<input type="number" step="0.1" min="0" max="100" name="vat" value="${esc(o.vat??db.company.defaultVat)}"></label><label class="field">Status<select name="status">${(type==='offers'?['Osnutek','Poslano','Potrjeno','Zavrnjeno']:['Osnutek','Poslano','Plačano','Zamuda']).map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="field span2">Opis / opomba<textarea name="desc">${esc(o.desc||'')}</textarea></label></div><h3>Postavke</h3><div class="invoicerows linehead"><span>Opis</span><span>Količina</span><span>Cena/enoto</span><span>Skupaj</span><span></span></div><div id="itemrows"></div><div class="actions" style="margin-top:12px"><button type="button" class="btn small" onclick="addItem()">＋ Dodaj postavko</button></div><p style="text-align:right;margin-top:15px"><b>Skupaj brez DDV: <span id="docTotal"></span></b></p><footer><button type="button" class="btn" onclick="closeModal()">Prekliči</button><button type="submit" class="btn primary">Shrani osnutek</button></footer></form>`);renderItems()}
function renderItems(){let el=document.getElementById('itemrows');if(!el)return;el.innerHTML=docItems.map((x,i)=>`<div class="invoicerows" style="margin:5px 0"><input aria-label="Opis" value="${esc(x.desc)}" oninput="updateItem(${i},'desc',this.value)"><input aria-label="Količina" type="number" step="0.01" min="0" value="${x.qty}" oninput="updateItem(${i},'qty',this.value)"><input aria-label="Cena" type="number" step="0.01" min="0" value="${x.price}" oninput="updateItem(${i},'price',this.value)"><span>${fmt(x.qty*x.price)}</span><button type="button" class="btn small" onclick="removeItem(${i})">×</button></div>`).join('');document.getElementById('docTotal').textContent=fmt(sum(docItems,x=>x.qty*x.price))}
function updateItem(i,k,v){docItems[i][k]=k==='desc'?v:Number(v)||0;let rows=document.getElementById('itemrows');let row=rows.children[i];if(row)row.children[3].textContent=fmt(docItems[i].qty*docItems[i].price);document.getElementById('docTotal').textContent=fmt(sum(docItems,x=>x.qty*x.price))}function addItem(){docItems.push({desc:'',qty:1,price:0});renderItems()}function removeItem(i){docItems.splice(i,1);renderItems()}
function submitDoc(e,type,edit){e.preventDefault();if(!docItems.length)return toast('Dodaj vsaj eno postavko');let obj=Object.fromEntries(new FormData(e.target));obj.items=clone(docItems);obj.vat=Number(obj.vat)||0;obj.amount=sum(docItems,x=>x.qty*x.price);if(edit)Object.assign(db[type].find(x=>x.id===edit),obj);else db[type].push({id:id(),...obj});save();closeModal();render();toast('Dokument shranjen kot osnutek')}
function convert(uid){let x=db.offers.find(x=>x.id===uid);if(!x)return;let n='R-'+new Date().getFullYear()+'-'+String(db.invoices.length+1).padStart(3,'0');db.invoices.push({...clone(x),id:id(),number:n,status:'Osnutek',sourceOffer:x.number});save();go('invoices');toast('Ustvarjen osnutek računa iz ponudbe')}
function printDoc(type,uid){let o=db[type].find(x=>x.id===uid),c=db.clients.find(x=>x.id===o.client)||{},co=db.company;let html=`<!doctype html><html lang="sl"><head><meta charset="utf-8"><title>${esc(o.number)} - OSNUTEK</title><style>body{font:14px Arial;color:#1d2935;margin:48px}header{display:flex;justify-content:space-between;align-items:start;border-bottom:3px solid #1d2935;padding-bottom:22px}h1{font-size:29px;margin:0}small{color:#677787}.label{color:#758597;font-size:12px}table{width:100%;border-collapse:collapse;margin-top:35px}th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}th{background:#f3f5f7}.right{text-align:right}.total{margin-top:30px;text-align:right;font-size:20px}.draft{background:#fff1d5;border:1px solid #e6c16e;padding:12px;margin:25px 0;color:#7f5615}.cols{display:flex;justify-content:space-between;gap:60px;margin-top:28px}footer{margin-top:55px;color:#718094;font-size:12px}</style></head><body><header><div><h1>ZAGORC</h1><small>${esc(co.name)}</small><p>${esc(co.address||'Naslov podjetja ni nastavljen')}<br>${esc(co.tax||'Davčna številka ni nastavljena')}<br>${esc(co.iban||'IBAN ni nastavljen')}</p></div><div class="right"><h1>${type==='offers'?'PONUDBA':'OSNUTEK RAČUNA'}</h1><b>${esc(o.number)}</b><p>Datum: ${dateFmt(o.date)}<br>Rok: ${dateFmt(o.due)}</p></div></header><div class="draft">PREIZKUSNI DOKUMENT – OSNUTEK. Ni davčno potrjen in ni namenjen izdaji kot uradni račun.</div><div class="cols"><div><div class="label">STRANKA</div><b>${esc(c.name||'Neznana stranka')}</b><p>${esc(c.address||'')}<br>${esc(c.tax||'')}<br>${esc(c.email||'')}</p></div></div><table><thead><tr><th>Opis</th><th>Količina</th><th>Cena</th><th class="right">Znesek</th></tr></thead><tbody>${(o.items||[]).map(x=>`<tr><td>${esc(x.desc)}</td><td>${esc(x.qty)}</td><td>${fmt(x.price)}</td><td class="right">${fmt(x.qty*x.price)}</td></tr>`).join('')}</tbody></table><div class="total">Osnova: ${fmt(o.amount)}<br>DDV (${o.vat}%): ${fmt(o.amount*o.vat/100)}<br><b>SKUPAJ: ${fmt(totalDoc(o))}</b></div><p>${esc(o.desc||'')}</p><footer>Prototip ZAGORC – ne vsebuje davčnega potrjevanja, e-računa ali drugih obveznih preverjanj.</footer><script>window.onload=()=>window.print()<\/script></body></html>`;let win=window.open('','_blank');if(!win)return toast('Dovoli pojavna okna za tisk');win.document.write(html);win.document.close()}
function exportData(){let blob=new Blob([JSON.stringify({application:'ZAGORC demo',version:1,data:db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='zagorc-varnostna-kopija-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Varnostna kopija pripravljena')}
async function importData(e){let file=e.target.files?.[0];if(!file)return;try{let parsed=JSON.parse(await file.text());let d=parsed.data;if(!d||!['clients','offers','invoices','projects','expenses','stock'].every(k=>Array.isArray(d[k]))||!d.company)throw Error('Napačna struktura');if(!confirm('Uvoz bo zamenjal vse trenutne lokalne podatke. Nadaljujem?'))return;db=d;save();render();toast('Podatki uvoženi')}catch(x){alert('Datoteka ni ustrezna varnostna kopija aplikacije ZAGORC.')}e.target.value=''}function resetDemo(){if(!confirm('Izbrišem trenutne podatke tega brskalnika in obnovim demo?'))return;db=clone(sample);save();go('home');toast('Demo ponastavljen')}
render();</script><script src="impala-no-spinners.js?v=4" defer></script><script>
